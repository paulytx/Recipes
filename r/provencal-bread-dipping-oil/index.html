: "Store in the fridge", "text": "Wrap in plastic wrap and refrigerate for up to 1 week."}], "nutrition": "Per serving (1 oz): about 102 kcal, 8 g protein, 12 g carbs, 2 g fat, 0 g fiber, 827 mg sodium, 31% DV calcium.", "source": "Cooking Light, High-Protein Recipes", "image": "img/homemade-queso-fresco.jpg", "added": "2026-10-10"}, {"id": "homemade-ricotta-cheese", "title": "Homemade Ricotta Cheese", "category": "Snacks", "description": "Fresh, creamy ricotta made from milk and buttermilk, far better than the store-bought tubs.", "servings": 16, "servingWord": "servings", "yieldNote": "Serves 16 (about ¼ cup each)", "activeTime": 40, "totalTime": 80, "equipment": ["Large heavy stockpot", "Candy thermometer", "Large colander", "Cheesecloth", "Slotted spoon", "Large bowl", "Kitchen string"], "groups": [{"name": "Cheese", "items": [{"key": "milk", "qty": 3800, "unit": "ml", "name": "2% reduced-fat milk", "short": "milk", "us": {"qty": 1, "unit": "gal"}}, {"key": "buttermilk", "qty": 1200, "unit": "ml", "name": "low-fat buttermilk", "short": "buttermilk", "us": {"qty": 5, "unit": "cup"}}, {"key": "salt", "qty": 0.5, "unit": "tsp", "name": "fine sea salt", "short": "salt"}]}], "steps": [{"title": "Line the colander", "text": "Line a large colander with 5 layers of damp cheesecloth, letting it hang over the edges. Set the colander in a large bowl."}, {"title": "Heat to 170°F", "text": "Combine {milk} and {buttermilk} in a large, heavy stockpot. Clip a candy thermometer to the side so the tip sits at least 2 inches into the milk. Cook over medium-high heat until it reads 170°F (77°C), about 20 minutes, stirring gently now and then.", "timer": 20}, {"title": "Heat to 190°F without stirring", "text": "Once it hits 170°F, stop stirring. The curds and whey will start to separate. Keep cooking until it reads 190°F (88°C). Don't stir, or the curds will break up. Take the pan off the heat right away. The bottom may scorch a little."}, {"title": "Spoon out the curds", "text": "Gently lift the curds into the lined colander with a slotted spoon. Discard the whey or save it for another use. Drain for 5 minutes.", "timer": 5}, {"title": "Hang to drain", "text": "Gather the cheesecloth edges and tie them securely. Hang the bundle from the kitchen faucet and drain for 15 minutes, or until the whey stops dripping.", "timer": 15}, {"title": "Season and cool", "text": "Scrape the ricotta into a bowl. Sprinkle with {salt} and toss gently with a fork. Cool to room temperature."}], "variations": ["Serve on crostini with chutney or a drizzle of honey."], "tips": ["The buttermilk is the acid that makes the milk curdle. Don't leave it out.", "Stir gently and only now and then while heating. Too much stirring stops the curds separating well.", "If your faucet is a gooseneck, lay a long wooden spoon across a corner of the sink and hang the bag from the handle."], "makeAhead": [{"title": "Store in the fridge", "text": "Keep covered in the refrigerator for up to 4 days."}], "nutrition": "Per serving (about ¼ cup): about 153 kcal, 11 g protein, 15 g carbs, 6 g fat, 0 g fiber, 302 mg sodium, 38% DV calcium.", "source": "Cooking Light, High-Protein Recipes", "image": "img/homemade-ricotta-cheese.jpg", "added": "2026-10-10"}, {"id": "everything-seasoned-almonds", "title": "Everything Seasoned Almonds", "category": "Snacks", "description": "Crunchy oven-toasted almonds coated in ground Everything bagel seasoning.", "servings": 12, "servingWord": "servings", "yieldNote": "Serves 12 (about ¼ cup each)", "activeTime": 5, "totalTime": 80, "equipment": ["Spice grinder", "Medium bowl", "Whisk", "Large rimmed baking sheet"], "groups": [{"name": "Almonds", "items": [{"key": "egg", "qty": 1, "name": "large egg white", "short": "egg white"}, {"key": "seasoning", "qty": 3, "unit": "tbsp", "name": "Everything bagel seasoning, ground", "short": "ground Everything bagel seasoning"}, {"key": "almonds", "qty": 430, "unit": "g", "name": "raw unsalted almonds", "short": "almonds", : "see tips for heat"}, {"key": "poblano", "qty": 2, "name": "medium poblano peppers, seeded and diced", "short": "poblano peppers"}, {"key": "garlic", "qty": 4, "name": "garlic cloves, minced", "short": "garlic cloves"}, {"key": "cumin", "qty": 1, "unit": "tbsp", "name": "ground cumin", "short": "cumin"}, {"key": "coriander", "qty": 1.5, "unit": "tsp", "name": "ground coriander", "short": "coriander"}, {"key": "ancho", "qty": 1, "unit": "tsp", "name": "ancho chile powder", "short": "ancho chile powder"}, {"key": "broth", "qty": 760, "unit": "ml", "name": "low-sodium chicken broth", "short": "remaining broth", "us": {"qty": 3, "unit": "cup"}, "note": "1 L (4 cups) broth in total"}, {"key": "salt", "qty": 0.5, "unit": "tsp", "name": "salt", "short": "salt", "note": "plus more to taste"}, {"key": "chicken", "qty": 1, "name": "rotisserie chicken, skin removed and shredded", "short": "shredded rotisserie chicken", "note": "about 4 cups"}, {"key": "beans", "qty": 1, "name": "can (15.5 oz / 439 g) white beans, rinsed and drained", "short": "can of whole white beans"}, {"key": "corn", "qty": 180, "unit": "ml", "name": "frozen corn", "short": "frozen corn", "us": {"qty": 0.75, "unit": "cup"}}, {"key": "lime", "qty": 15, "unit": "ml", "name": "fresh lime juice", "short": "lime juice", "us": {"qty": 1, "unit": "tbsp"}, "note": "about 1 lime, plus more to taste"}, {"key": "cilantro", "qty": 60, "unit": "ml", "name": "fresh cilantro, chopped", "short": "chopped cilantro", "us": {"qty": 0.25, "unit": "cup"}}]}, {"name": "To serve (optional)", "items": [{"name": "Sour cream"}, {"name": "Crushed tortilla chips"}, {"name": "Shredded cheddar or Pepper Jack cheese"}, {"name": "Lime wedges"}]}], "steps": [{"title": "Purée half the beans", "text": "In a food processor, blend {beansBlend} with {brothBlend} until smooth. Set the purée aside."}, {"title": "Soften the vegetables", "text": "Heat {oil} in a large pot over medium-high heat. Add {onion}, {jalapeno} and {poblano} and cook, stirring often, until soft, 4–5 minutes.", "timer": 5}, {"title": "Add garlic and spices", "text": "Add {garlic} and cook for 1 minute. Stir in {cumin}, {coriander} and {ancho} and cook, stirring, for 1 minute more to toast the spices.", "timer": 2}, {"title": "Simmer", "text": "Add {broth}, the bean purée and {salt}. Bring to a boil, then lower the heat and simmer uncovered for 20 minutes.", "timer": 20}, {"title": "Add chicken, beans and corn", "text": "Stir in {chicken}, {beans}, {corn} and {lime}. Return to a simmer and cook until heated through, about 5 minutes.", "timer": 5}, {"title": "Season and serve", "text": "Taste and add more salt and lime juice if needed, then stir in {cilantro}. It should be a little soupy; it thickens as it sits. Ladle into bowls and serve with your choice of toppings."}], "variations": ["For a spicier chili, save the pepper seeds and ribs and stir some in at the end."], "tips": ["All the heat is in the pepper seeds and ribs. Leave them out for a mild, family-friendly chili.", "Wash your hands well after handling pepper seeds and avoid touching your eyes."], "makeAhead": [{"title": "Fridge", "text": "Keep in an airtight container in the refrigerator for up to 3 days. It thickens as it sits, so add a splash of broth or water when reheating."}, {"title": "Freeze", "text": "Freeze for up to 3 months. Reheat on the stovetop over medium-low heat until hot, thinning with broth or water as needed."}], "nutrition": "Per serving, without toppings: about 465 kcal, 32 g protein, 40 g carbs, 20 g fat, 8 g fiber, 913 mg sodium.", "source": "Once Upon a Chef (Jennifer Segal), adapted from Food Network", "image": "img/white-chicken-chili.jpg", "added": "2026-10-10"}, {"id": "shrimp-and-scallop-pappardelle", "title": "Shrimp and Scallop Pappardelle", "category": "Mains", "description": "Fresh pappardelle with seared shrimp and scallops in black truffle brown butter, with blistered heirloom tomatoes, baby arugula and shaved pecorino.", "servings": 2, "servingWord": "servings", "yieldNote": "Serves 2 as a main", "activeTime": 60, "totalTime": 90, "equipment": ["Pasta machine or rolling pin", "Large pot", "Large (12-inch) skillet", "Vegetable peeler", "Small heatproof bowl or cup"], "groups": [{"name": "Fresh pappardelle", "items": [{"key": "flour", "qty": 100, "unit": "g", "name": "\"00\" or all-purpose flour", "short": "flour", "us": {"qty": 0.83, "unit": "cup"}}, {"key": "eggs", "qty": 1, "name": "large egg", "short": "egg"}, {"name": "Pinch of salt"}, {"name": "Semolina, for dusting"}]}, {"name": "Or store-bought pappardelle (instead of the above)", "items": [{"key": "storeFresh", "qty": 115, "unit": "g", "name": "fresh pappardelle", "short": "fresh pappardelle", "us": {"qty": 4, "unit": "oz"}}, {"key": "storeDried", "qty": 85, "unit": "g", "name": "dried pappardelle (if you can't find fresh)", "short": "dried pappardelle", "us": {"qty": 3, "unit": "oz"}}]}, {"name": "Seafood", "items": [{"key": "shrimp", "qty": 170, "unit": "g", "name": "large shrimp, peeled and deveined", "short": "shrimp", "us": {"qty": 6, "unit": "oz"}}, {"key": "scallops", "qty": 170, "unit": "g", "name": "dry-packed sea scallops", "short": "scallops", "us": {"qty": 6, "unit": "oz"}, "note": "about 4 large"}, {"key": "oil", "qty": 30, "unit": "ml", "name": "olive oil", "short": "olive oil", "us": {"qty": 2, "unit": "tbsp"}, "note": "divided"}, {"key": "basteButter", "qty": 15, "unit": "g", "name": "unsalted butter, for basting", "short": "butter", "us": {"qty": 1, "unit": "tbsp"}}]}, {"name": "Sauce", "items": [{"key": "tomatoes", "qty": 150, "unit": "g", "name": "mixed heirloom cherry tomatoes", "short": "cherry tomatoes", "us": {"qty": 5, "unit": "oz"}}, {"key": "butter", "qty": 70, "unit": "g", "name": "unsalted butter, for browning", "short": "butter", "us": {"qty": 5, "unit": "tbsp"}, "note": "plenty, so some pools in the bowl"}, {"key": "shallot", "qty": 1, "name": "small shallot, minced", "short": "shallot"}, {"key": "garlic", "qty": 1, "name": "garlic clove, thinly sliced", "short": "garlic clove"}, {"key": "wine", "qty": 30, "unit": "ml", "name": "dry white wine", "short": "white wine", "us": {"qty": 2, "unit": "tbsp"}}, {"key": "truffle", "qty": 15, "unit": "g", "name": "black truffle butter", "short": "truffle butter", "us": {"qty": 1, "unit": "tbsp"}, "note": "or truffle oil, paste or porcini powder (see variations)"}, {"key": "lemon", "qty": 0.25, "name": "lemon", "short": "lemon"}]}, {"name": "To finish", "items": [{"key": "arugula", "qty": 30, "unit": "g", "name": "baby arugula", "short": "baby arugula", "us": {"qty": 1.5, "unit": "cup"}, "note": "a large handful"}, {"key": "pecorino", "qty": 30, "unit": "g", "name": "pecorino romano, shaved with a peeler", "short": "shaved pecorino", "us": {"qty": 1, "unit": "oz"}}, {"name": "Flaky sea salt (such as Maine sea salt)"}, {"name": "Freshly ground black pepper"}, {"name": "Radish microgreens (optional)"}]}], "steps": [{"title": "Make the dough", "text": "Mound {flour} with a pinch of salt and make a well. Add {eggs}, beat them with a fork, then gradually pull in the flour. Knead for 8–10 minutes until smooth and elastic.", "timer": 10}, {"title": "Rest the dough", "text": "Wrap the dough tightly and let it rest at room temperature for 30 minutes.", "timer": 30}, {"title": "Roll and cut", "text": "Roll the dough thin enough to see your hand through it (setting 6 of 9 on most machines). Cut into ribbons about 2.5 cm (1 inch) wide and toss with semolina so they don't stick. Put a large pot of well-salted water on to boil."}, {"title": "Blister the tomatoes", "text": "Heat half the oil in a large skillet over high heat. Add {tomatoes} and cook, shaking the pan, until the skins blister and split. Season with salt and set aside.", "timer": 4}, {"title": "Sear the scallops", "text": "Pat {scallops} very dry and season with salt. Add the rest of the oil to the skillet over medium-high heat and sear the scallops without moving them until deeply browned, about 2 minutes. Flip them, add {basteButter} and tilt the pan, spooning the foaming butter over the scallops for the last 30–60 seconds. Set aside, leaving the butter in the pan.", "timer": 3}, {"title": "Sear the shrimp", "text": "Season {shrimp} with salt and sear in the same buttery pan, spooning the butter over them, until just pink, 1–2 minutes per side. Set aside with the scallops, then cut the scallops in half. Wipe out any blackened bits.", "timer": 3}, {"title": "Brown the butter", "text": "Lower the heat to medium and add {butter}. Cook, swirling, until it foams, smells nutty and turns amber. Pour it into a small heatproof bowl and let it stand for a minute so the toasted solids sink.", "timer": 4}, {"title": "Start the sauce", "text": "Gently pour the clear amber top half of the brown butter into a cup and keep it warm for serving. Scrape the rest, with all the toasted solids, back into the skillet over medium heat. Add {shallot} and {garlic} and cook for 1 minute, then add {wine} and let it reduce by half.", "timer": 2}, {"title": "Cook the pasta", "text": "Cook the fresh pappardelle in the boiling water until tender, 2–3 minutes. Store-bought fresh pasta takes about the same; dried follows the package. Save a cup of pasta water before draining.", "timer": 3}, {"title": "Bring it together", "text": "Add the pasta to the skillet with a generous ladle of pasta water and toss over medium heat until the sauce turns glossy and clings to the noodles. Add more water if it looks dry. Take the pan off the heat and swirl in {truffle} so its aroma stays bright. Squeeze in juice from {lemon}, then fold in the seafood, tomatoes and {arugula} until the arugula just wilts."}, {"title": "Finish and serve", "text": "Spoon most of the reserved clear brown butter into the bottom of warm bowls. Twirl the pasta on top, arrange the seafood and tomatoes, and drizzle over the last of the butter. Top with {pecorino}, microgreens if using, flaky sea salt and black pepper."}], "variations": ["No truffle butter, option 1 (closest and easiest): black truffle oil. Drizzle ½–1 teaspoon over each bowl at the very end. Look for one made with real truffle; a little goes a long way.", "Option 2: black truffle paste from a jar. Stir 1 teaspoon into the pasta off the heat, per 2 servings. Freeze leftovers in small portions.", "Option 3: porcini powder (ground dried porcini). Whisk ½ teaspoon into the butter as it browns, per 2 servings, for an earthy note without truffle.", "Option 4: black truffle salt as the finishing salt instead of flaky salt. Pairs well with any of the above.", "Option 5: skip truffle entirely. The brown butter, seafood, tomatoes and pecorino still carry the dish.", "Store-bought pasta: use the quantities in the store-bought group and skip steps 1–3.", "Use all shrimp or all scallops if that's what you can find."], "tips": ["Buy dry-packed scallops. Wet-packed ones release water and won't brown.", "Add truffle butter, paste or oil off the heat; high heat dulls the truffle aroma.", "Don't crowd the pan when searing. Work in batches if needed.", "Sear in oil first, then add butter: butter alone burns at searing heat. Olive oil adds a mild, welcome flavor; regular olive oil handles the heat best, or use extra-virgin and watch for smoke.", "Fresh pasta soaks up butter fast, so hold back the clear brown butter for the bowls rather than tossing it all with the noodles."], "makeAhead": [{"title": "Dough", "text": "Wrap tightly and refrigerate for up to 1 day. Bring to room temperature before rolling."}, {"title": "Freeze cut pasta", "text": "Dust the ribbons well with semolina, twist into nests and freeze on a tray, then bag. Keeps 1 month. Cook from frozen, adding about 1 minute."}, {"title": "Truffle butter", "text": "Cut into tablespoon portions, wrap and freeze for several months. Use straight from the freezer."}], "source": "Restaurant menu dish, recreated from the menu description and photo", "image": "img/shrimp-and-scallop-pappardelle.jpg", "added": "2026-10-10"}, {"id": "roasted-vegetable-platter-garlic-yogurt", "title": "Roasted Vegetable Platter with Garlic Yogurt", "category": "Sides", "description": "Kabocha squash, broccoli, cauliflower, Brussels sprouts and red onion roasted hot, charred under the broiler and served around a cool garlic yogurt dip.", "servings": 8, "servingWord": "servings", "yieldNote": "Serves 8 as a side", "activeTime": 25, "totalTime": 55, "equipment": ["3 large baking sheets", "Large mixing bowl", "Small bowl", "Large serving platter"], "groups": [{"name": "Vegetables", "items": [{"key": "squash", "qty": 1, "name": "small kabocha squash (about 1 kg / 2 lb), seeded and cut into 2 cm / ¾ in wedges, skin on", "short": "squash wedges"}, {"key": "broccoli", "qty": 1, "name": "large head broccoli, cut into florets with some stalk", "short": "broccoli"}, {"key": "cauli", "qty": 1, "name": "small head cauliflower, cut into florets", "short": "cauliflower"}, {"key": "sprouts", "qty": 450, "unit": "g", "name": "Brussels sprouts, trimmed and halved", "short": "Brussels sprouts", "us": {"qty": 1, "unit": "lb"}}, {"key": "onion", "qty": 2, "name": "red onions, cut into thick wedges", "short": "red onions"}, {"key": "oil", "qty": 90, "unit": "ml", "name": "olive oil", "short": "olive oil", "us": {"qty": 6, "unit": "tbsp"}}, {"key": "salt", "qty": 2, "unit": "tsp", "name": "kosher salt", "short": "salt"}, {"key": "pepper", "qty": 1, "unit": "tsp", "name": "freshly ground black pepper", "short": "black pepper"}]}, {"name": "Garlic yogurt", "items": [{"key": "yogurt", "qty": 250, "unit": "g", "name": "plain Greek yogurt", "short": "Greek yogurt", "us": {"qty": 1, "unit": "cup"}}, {"key": "garlic", "qty": 1, "name": "garlic clove, finely grated", "short": "garlic"}, {"key": "lemon", "qty": 15, "unit": "ml", "name": "fresh lemon juice", "short": "lemon juice", "us": {"qty": 1, "unit": "tbsp"}}, {"key": "salt2", "qty": 0.25, "unit": "tsp", "name": "kosher salt", "short": "salt"}]}, {"name": "To serve", "items": [{"name": "Fresh cilantro leaves, roughly chopped"}]}], "steps": [{"title": "Heat the oven", "text": "Heat the oven to 220°C / 200°C fan / gas 7 (425°F), with racks in the upper and lower thirds."}, {"title": "Season the vegetables", "text": "Split {oil}, {salt} and {pepper} roughly into thirds. In a large bowl, toss {squash} and {onion} with one third and spread on a baking sheet. Repeat with {broccoli} and {cauli} on a second sheet, then {sprouts} on a third, cut sides down. Give everything room so it browns instead of steaming."}, {"title": "Roast", "text": "Roast for 25–30 minutes, turning the vegetables and swapping the trays halfway, until tender and browned at the edges.", "timer": 28}, {"title": "Make the garlic yogurt", "text": "While the vegetables roast, stir together {yogurt}, {garlic}, {lemon} and {salt2}. Taste and add more salt or lemon if needed."}, {"title": "Char under the broiler", "text": "Switch the broiler to high. Broil one tray at a time for 2–4 minutes, until the edges char. Watch closely, as it goes from charred to burnt fast.", "timer": 3}, {"title": "Build the platter", "text": "Set the bowl of garlic yogurt in the middle of a large platter. Arrange each vegetable in its own section around it, scatter with cilantro and serve warm or at room temperature."}], "variations": ["Swap kabocha for butternut or delicata squash; peel butternut first.", "Use labneh or sour cream instead of Greek yogurt for a richer dip.", "Grill it: thread smaller pieces on skewers or use a grill basket over medium-high heat for 10–15 minutes, turning often."], "tips": ["Kabocha skin is edible once roasted, so there's no need to peel it.", "Cut the vegetables to a similar thickness so they finish at the same time.", "Dry the vegetables well after washing so they roast crisp."], "makeAhead": [{"title": "Prep ahead", "text": "Cut the vegetables up to 1 day ahead and keep them in the fridge. Make the garlic yogurt up to 2 days ahead; the garlic gets stronger as it sits."}, {"title": "Leftovers", "text": "Keep in the fridge for up to 4 days. Reheat on a tray at 200°C / 400°F for about 10 minutes to crisp them back up. Not great frozen, as the texture goes soft."}], "source": "Home-cooked platter, recreated from a photo of the dish", "image": "img/roasted-vegetable-platter-garlic-yogurt.jpg", "added": "2026-10-11"}, {"id": "mediterranean-chopped-salad", "title": "Mediterranean Chopped Salad", "category": "Sides", "description": "A crunchy chopped salad of cucumber, tomatoes, chickpeas, olives and romaine in a sharp red wine vinaigrette, finished with feta.", "servings": 4, "servingWord": "servings", "yieldNote": "Serves 4 as a light main or 6 as a side", "activeTime": 20, "totalTime": 40, "equipment": ["Colander", "Large bowl", "Whisk"], "groups": [{"name": "Salted vegetables", "items": [{"key": "cucumber", "qty": 1, "name": "medium cucumber", "short": "cucumber", "note": "about 1¼ cups once diced"}, {"key": "tomatoes", "qty": 300, "unit": "g", "name": "grape tomatoes, quartered", "short": "grape tomatoes", "us": {"qty": 1, "unit": "pint"}}, {"key": "salt", "qty": 1, "unit": "tsp", "name": "table salt", "short": "salt", "note": "plus more to season"}]}, {"name": "Dressing and mix-ins", "items": [{"key": "oil", "qty": 45, "unit": "ml", "name": "extra-virgin olive oil", "short": "olive oil", "us": {"qty": 3, "unit": "tbsp"}}, {"key": "vinegar", "qty": 45, "unit": "ml", "name": "red wine vinegar", "short": "red wine vinegar", "us": {"qty": 3, "unit": "tbsp"}}, {"key": "garlic", "qty": 1, "name": "medium garlic clove, minced", "short": "garlic clove, minced"}, {"key": "chickpeas", "qty": 1, "name": "can (400 g / 14 oz) chickpeas, drained and rinsed", "short": "can chickpeas"}, {"key": "olives", "qty": 120, "unit": "ml", "name": "pitted kalamata olives, chopped", "short": "kalamata olives", "us": {"qty": 0.5, "unit": "cup"}}, {"key": "onion", "qty": 0.5, "name": "small red onion, finely chopped", "short": "small red onion", "note": "about ¼ cup"}, {"key": "parsley", "qty": 120, "unit": "ml", "name": "fresh parsley, roughly chopped", "short": "parsley", "us": {"qty": 0.5, "unit": "cup"}}]}, {"name": "To finish", "items": [{"key": "romaine", "qty": 1, "name": "romaine heart, cut into 1 cm (½ in) pieces", "short": "romaine heart", "note": "about 3 cups"}, {"key": "feta", "qty": 115, "unit": "g", "name": "feta, crumbled", "short": "crumbled feta", "us": {"qty": 4, "unit": "oz"}, "note": "about 1 cup"}, {"name": "Ground black pepper"}]}], "steps": [{"title": "Seed and dice the cucumber", "text": "Peel {cucumber}, halve it lengthwise and scoop out the seeds with a spoon. Cut each half into 5–8 cm (2–3 in) lengths, stand them cut-side up and slice into even sticks, then cut across into 1 cm (½ in) dice."}, {"title": "Salt and drain", "text": "Toss the cucumber, {tomatoes} and {salt} in a colander set over a bowl. Leave to drain for 15 minutes.", "timer": 15}, {"title": "Dress and marinate", "text": "In a large bowl, whisk {oil}, {vinegar} and {garlic}. Add the drained cucumber and tomatoes, {chickpeas}, {olives}, {onion} and {parsley}. Toss and leave at room temperature for 5 minutes to soak up the dressing.", "timer": 5}, {"title": "Finish and serve", "text": "Add {romaine} and {feta} and toss. Season with salt and pepper and serve."}], "variations": ["Add diced red or yellow pepper with the chickpeas.", "Top with grilled chicken or shrimp to make it a full meal."], "tips": ["Seeding the cucumber and salting the tomatoes pulls out their water, so the salad doesn't go soggy.", "Equal parts oil and vinegar makes a bright, punchy dressing."], "makeAhead": [{"title": "Prep ahead", "text": "Chop the vegetables and mix the dressing up to a day ahead, stored separately in the fridge. Salt, drain and toss everything together just before serving. Not suited to freezing."}], "source": "Cook's Illustrated, July 2009", "image": "img/mediterranean-chopped-salad.jpg", "added": "2026-10-12"}, {"id": "turkey-jus-gras", "title": "Turkey Jus Gras", "category": "Sides", "description": "A glossy turkey gravy alternative: reduced stock blended with herb oil and a little gelatin and xanthan gum to hold it together.", "servings": 2, "servingWord": "cups", "yieldNote": "Makes about 1 pint (2 cups)", "activeTime": 5, "totalTime": 35, "equipment": ["3-quart saucepan", "Blender (or immersion blender)", "Digital scale"], "groups": [{"name": "Jus", "items": [{"key": "stock", "qty": 1000, "unit": "g", "name": "turkey stock, homemade or store-bought", "short": "turkey stock", "us": {"qty": 4.25, "unit": "cup"}}, {"name": "Gelatin powder (such as Knox)", "note": "9–12% by weight, as needed"}, {"name": "Xanthan gum", "note": "0.3–0.4% by weight, as needed"}, {"key": "oil", "qty": 160, "unit": "g", "name": "Holiday Herb Oil, or any fat you like", "short": "herb oil", "us": {"qty": 0.75, "unit": "cup"}}]}], "steps": [{"title": "Reduce the stock", "text": "Bring {stock} to a simmer in a saucepan over high heat. Cook until reduced by half, 20–30 minutes.", "timer": 25}, {"title": "Blend in the thickeners", "text": "Pour the reduced stock into a blender. With the motor on low, add the gelatin and xanthan gum and blend until combined. Turn up the speed for a few seconds to shear them in fully so they don't clump. An immersion blender works too, but a whisk isn't strong enough."}, {"title": "Emulsify", "text": "With the blender running, add {oil} in a slow, steady stream. Pouring too fast can break the emulsion."}, {"title": "Serve warm", "text": "Use right away, or keep warm at 60–66°C (140–150°F). If it cools too much it starts to set and the oil separates."}], "tips": ["The source gives the gelatin and xanthan as percentages by weight, so a digital scale makes this much easier.", "With gelatin alone, the sauce looks thinner until it cools slightly.", "Using butter? Melt it first, or brown it for a nuttier flavor. It gives a silkier sauce but firms up as it cools."], "source": "ChefSteps", "image": "img/turkey-jus-gras.jpg", "added": "2026-10-12"}, {"id": "tandoori-chicken", "title": "Tandoori Chicken", "category": "Mains", "description": "Spice-rubbed chicken coated in garlicky yogurt, gently baked, then broiled for a lightly charred crust, with no tandoor or overnight marinade needed.", "servings": 4, "servingWord": "servings", "yieldNote": "Serves 4", "activeTime": 25, "totalTime": 90, "equipment": ["Small skillet", "Medium and large bowls", "Rimmed baking sheet with wire rack", "Foil", "Instant-read thermometer"], "groups": [{"name": "Spice mixture", "items": [{"key": "oil", "qty": 30, "unit": "ml", "name": "vegetable oil", "short": "vegetable oil", "us": {"qty": 2, "unit": "tbsp"}}, {"key": "garlic", "qty": 6, "name": "medium garlic cloves, minced", "short": "garlic cloves, minced", "note": "about 2 tbsp"}, {"key": "ginger", "qty": 2, "unit": "tbsp", "name": "fresh ginger, grated", "short": "grated ginger"}, {"key": "masala", "qty": 1, "unit": "tbsp", "name": "garam masala", "short": "garam masala", "note": "see Notes for a swap"}, {"key": "cumin", "qty": 2, "unit": "tsp", "name": "ground cumin", "short": "cumin"}, {"key": "chili", "qty": 2, "unit": "tsp", "name": "chili powder", "short": "chili powder"}]}, {"name": "Yogurt coating", "items": [{"key": "yogurt", "qty": 240, "unit": "ml", "name": "plain whole-milk yogurt", "short": "yogurt", "us": {"qty": 1, "unit": "cup"}, "note": "low-fat works too"}, {"key": "lime1", "qty": 30, "unit": "ml", "name": "fresh lime juice", "short": "lime juice", "us": {"qty": 2, "unit": "tbsp"}}]}, {"name": "Chicken", "items": [{"key": "lime2", "qty": 30, "unit": "ml", "name": "fresh lime juice", "short": "lime juice", "us": {"qty": 2, "unit": "tbsp"}, "note": "2 limes give enough for both"}, {"key": "salt", "qty": 2, "unit": "tsp", "name": "table salt", "short": "salt"}, {"key": "chicken", "qty": 1350, "unit": "g", "name": "bone-in chicken parts (breasts, thighs, drumsticks or a mix), skin removed and fat trimmed", "short": "chicken", "us": {"qty": 3, "unit": "lb"}, "note": "halve the breasts"}]}, {"name": "To serve", "items": [{"key": "lime", "qty": 1, "name": "lime, cut into wedges", "short": "lime, in wedges"}, {"name": "Basmati rice"}, {"name": "Chutney or relish"}]}], "steps": [{"title": "Toast the spices", "text": "Heat {oil} in a small skillet over medium heat until shimmering. Add {garlic} and {ginger} and cook until fragrant, about 1 minute. Add {masala}, {cumin} and {chili} and cook until fragrant, 30–60 seconds more."}, {"title": "Make the yogurt coating", "text": "Scrape half the spice mixture into a medium bowl. Stir in {yogurt} and {lime1} and set aside."}, {"title": "Score and rub the chicken", "text": "In a large bowl, mix the rest of the spice mixture with {lime2} and {salt}. Cut 2 or 3 shallow slashes, about 3 mm (⅛ in) deep and 2.5 cm (1 in) apart, into the skinned side of each piece of {chicken}. Add to the bowl and massage the rub in until evenly coated. Leave at room temperature for 30 minutes.", "timer": 30}, {"title": "Coat and bake", "text": "Set a rack about 15 cm (6 in) below the broiler and heat the oven to 165°C / 145°C fan / gas 3 (325°F). Toss the chicken in the yogurt mixture until thickly coated. Arrange scored-side down on a wire rack set in a foil-lined rimmed baking sheet and discard the leftover yogurt. Bake until breasts reach 52°C (125°F) and legs and thighs 54°C (130°F), 15–25 minutes. Move pieces to a plate as they get there.", "timer": 20}, {"title": "Heat the broiler", "text": "With the chicken out of the oven, switch to broil and let it heat for 10 minutes.", "timer": 10}, {"title": "Broil", "text": "Flip the chicken pieces and broil until lightly charred in spots and breasts reach 74°C (165°F) and legs and thighs 79°C (175°F), 8–15 minutes.", "timer": 12}, {"title": "Rest and serve", "text": "Move the chicken to a platter, tent loosely with foil and rest for 5 minutes. Serve with {lime}, basmati rice and chutney.", "timer": 5}], "variations": ["Use all thighs and drumsticks for the juiciest result.", "Serve with warm naan and a cucumber raita."], "tips": ["No garam masala? Mix 2 tsp ground coriander, ¼ tsp ground cardamom, ¼ tsp ground cinnamon and ½ tsp black pepper.", "Take the chicken out before switching to broil so the element gets fully hot.", "Smaller pieces cook faster, so check each one with the thermometer."], "makeAhead": [{"title": "Prep ahead", "text": "Make the spice mixture and yogurt coating up to a day ahead and keep covered in the fridge."}, {"title": "Leftovers", "text": "Keep in the fridge for up to 3 days and reheat at 180°C / 350°F for about 15 minutes. Cooked chicken freezes well for up to 3 months."}], "source": "Cook's Illustrated", "image": "img/tandoori-chicken.jpg", "added": "2026-10-12"}, {"id": "tiramisu", "title": "Tiramisu", "category": "Desserts", "description": "Espresso-soaked ladyfingers layered with a light, fluffy mascarpone cream and finished with cocoa and dark chocolate.", "servings": 8, "servingWord": "servings", "yieldNote": "Serves 6–8", "activeTime": 30, "totalTime": 390, "equipment": ["Shallow bowl", "2 large bowls", "Whisk or electric mixer", "20 x 25 cm (8 x 10 in) serving dish"], "groups": [{"name": "Mascarpone cream", "items": [{"key": "eggs", "qty": 4, "name": "eggs, separated", "short": "eggs"}, {"key": "sugar", "qty": 200, "unit": "g", "name": "sugar", "short": "sugar", "us": {"qty": 1, "unit": "cup"}}, {"key": "mascarpone", "qty": 450, "unit": "g", "name": "mascarpone", "short": "mascarpone", "us": {"qty": 2, "unit": "cup"}}]}, {"name": "Layers", "items": [{"key": "espresso", "qty": 350, "unit": "ml", "name": "strong espresso", "short": "strong espresso", "us": {"qty": 1.5, "unit": "cup"}}, {"key": "ladyfingers", "qty": 30, "name": "ladyfingers", "short": "ladyfingers", "note": "28–32"}]}, {"name": "To finish", "items": [{"name": "Cocoa powder, for dusting"}, {"key": "chocolate", "qty": 72, "unit": "g", "name": "dark chocolate, shaved", "short": "dark chocolate shavings", "us": {"qty": 2.5, "unit": "oz"}}]}], "steps": [{"title": "Cool the espresso", "text": "Make {espresso} and let it cool in a shallow bowl."}, {"title": "Whip the yolks", "text": "Separate {eggs}. In a large bowl, whisk the yolks until pale and fluffy, about 5 minutes."}, {"title": "Add sugar and mascarpone", "text": "Gradually whisk {sugar} into the yolks until it dissolves. Add {mascarpone} and whip together."}, {"title": "Fold in the whites", "text": "In a clean bowl, whisk the egg whites to stiff peaks, 8–10 minutes. Gently fold them into the mascarpone mixture."}, {"title": "Layer", "text": "Dip half of {ladyfingers} into the espresso, coating both sides, and lay them in the serving dish. Spread over half the mascarpone cream. Repeat with the rest of the ladyfingers and cream."}, {"title": "Chill", "text": "Cover and refrigerate for at least 6 hours, or overnight.", "timer": 360}, {"title": "Finish and serve", "text": "Dust the top with cocoa powder, scatter over {chocolate} and serve cold."}], "variations": ["Add 2–3 tbsp coffee liqueur, marsala or dark rum to the cooled espresso.", "Build it in individual glasses for easy serving."], "tips": ["Dip the ladyfingers quickly; they soak up espresso fast and can turn soggy.", "The eggs aren't cooked. Use pasteurized eggs if serving anyone pregnant, very young, elderly or with a weak immune system."], "makeAhead": [{"title": "Make it ahead", "text": "Assemble up to 2 days ahead and keep covered in the fridge. Dust with cocoa just before serving."}, {"title": "Freeze", "text": "Wrap well and freeze for up to 1 month. Thaw overnight in the fridge."}], "source": "Recipe printout", "image": "img/tiramisu.jpg", "added": "2026-10-12"}, {"id": "sweet-potato-soup", "title": "Sweet Potato Soup", "category": "Soups", "description": "A silky, intensely flavored sweet potato soup with just shallot, thyme and butter, plus a few blended peels for earthiness.", "servings": 6, "servingWord": "servings", "yieldNote": "Serves 4–6 as a main or 8 as a starter", "activeTime": 20, "totalTime": 55, "equipment": ["Large saucepan", "Blender"], "groups": [{"name": "Soup", "items": [{"key": "butter", "qty": 55, "unit": "g", "name": "unsalted butter", "short": "butter", "us": {"qty": 4, "unit": "tbsp"}}, {"key": "shallot", "qty": 1, "name": "shallot, thinly sliced", "short": "shallot, thinly sliced"}, {"key": "thyme", "qty": 4, "name": "sprigs fresh thyme", "short": "thyme sprigs"}, {"key": "water", "qty": 1000, "unit": "ml", "name": "water", "short": "water", "us": {"qty": 4.25, "unit": "cup"}}, {"key": "potatoes", "qty": 900, "unit": "g", "name": "sweet potatoes, peeled, halved lengthwise and sliced 5 mm (¼ in) thick", "short": "sliced sweet potatoes", "us": {"qty": 2, "unit": "lb"}, "note": "keep a quarter of the peels"}, {"key": "sugar", "qty": 1, "unit": "tbsp", "name": "packed brown sugar", "short": "brown sugar"}, {"key": "vinegar", "qty": 0.5, "unit": "tsp", "name": "cider vinegar", "short": "cider vinegar"}, {"key": "salt", "qty": 1.5, "unit": "tsp", "name": "salt", "short": "salt", "note": "plus more to taste"}, {"key": "pepper", "qty": 0.25, "unit": "tsp", "name": "ground black pepper", "short": "pepper"}]}, {"name": "To serve", "items": [{"name": "Fresh chives, minced"}]}], "steps": [{"title": "Soften the shallot", "text": "Melt {butter} in a large saucepan over medium-low heat. Add {shallot} and {thyme} and cook until the shallot is soft but not browned, about 5 minutes.", "timer": 5}, {"title": "Soak the potatoes", "text": "Add {water}, turn the heat to high and bring to a simmer. Take the pan off the heat, add {potatoes} and the reserved peels, and leave uncovered for 20 minutes.", "timer": 20}, {"title": "Simmer", "text": "Add {sugar}, {vinegar}, {salt} and {pepper}. Bring to a simmer over high heat, then cover, turn to medium-low and cook until the potatoes are very soft, about 10 minutes.", "timer": 10}, {"title": "Blend", "text": "Remove the thyme sprigs. Blend the soup in batches until smooth, 45–60 seconds each, and pour back into the clean pan."}, {"title": "Season and serve", "text": "Bring back to a simmer over medium heat, thinning with a little water if you like. Season with salt and pepper and top each bowl with chives."}], "variations": ["Finish with a swirl of sour cream or crème fraîche.", "Top with toasted pumpkin seeds or crumbled bacon for crunch."], "tips": ["The 20-minute soak turns some of the starch into sugar, so the soup needs less water and tastes more of sweet potato.", "Only a quarter of the peels go in; more can overpower the soup.", "Fill the blender no more than halfway with hot soup and hold the lid down with a towel."], "makeAhead": [{"title": "Fridge and freezer", "text": "Keeps up to 3 days in the fridge or 1 month in the freezer. Reheat gently, adding a splash of water if it has thickened."}], "source": "Cook's Illustrated", "image": "img/sweet-potato-soup.jpg", "added": "2026-10-12"}, {"id": "sous-vide-holiday-turkey", "title": "Sous Vide Holiday Turkey", "category": "Mains", "description": "A whole turkey broken down and cooked sous vide, with legs and breasts at their own temperatures, then seared for crisp skin.", "servings": 12, "servingWord": "servings", "yieldNote": "Serves 8–12", "activeTime": 120, "totalTime": 1500, "equipment": ["Sous vide circulator (such as Joule)", "Digital scale", "Quarter sheet pan", "30 cm (12 in) carbon steel or stainless skillet", "Tongs", "Two 2-gallon zip-top freezer bags or vacuum bags", "Stockpot or Dutch oven (optional)", "Fine-mesh strainer (optional)"], "groups": [{"name": "Turkey", "items": [{"key": "turkey", "qty": 1, "name": "whole turkey, fresh or fully thawed (5.4–7.25 kg / 12–16 lb)", "short": "turkey"}, {"name": "Kosher salt", "note": "1% of the breast and leg weight"}, {"name": "Sugar", "note": "0.5% of the breast and leg weight"}, {"key": "oil1", "qty": 60, "unit": "g", "name": "neutral oil, for presearing", "short": "neutral oil", "us": {"qty": 0.25, "unit": "cup"}}, {"key": "oil2", "qty": 60, "unit": "g", "name": "neutral oil, for the bags", "short": "neutral oil", "us": {"qty": 0.25, "unit": "cup"}}, {"key": "oil3", "qty": 60, "unit": "g", "name": "neutral oil, for the final sear", "short": "neutral oil", "us": {"qty": 0.25, "unit": "cup"}}, {"key": "sage", "qty": 6, "unit": "g", "name": "fresh sage leaves", "short": "sage leaves", "note": "optional"}]}, {"name": "Turkey stock (optional)", "items": [{"name": "Reserved turkey carcass, neck and wings"}, {"key": "onion", "qty": 1, "name": "yellow onion, cut into 8 pieces", "short": "yellow onion"}, {"key": "peppercorns", "qty": 8, "unit": "g", "name": "whole black peppercorns", "short": "black peppercorns", "us": {"qty": 1, "unit": "tbsp"}}, {"key": "sage2", "qty": 3, "unit": "g", "name": "fresh sage leaves", "short": "sage leaves"}, {"key": "thyme", "qty": 3, "unit": "g", "name": "fresh thyme sprigs", "short": "thyme sprigs"}]}], "steps": [{"title": "Heat the water bath", "text": "Heat a sous vide bath to 65°C (149°F)."}, {"title": "Break down the turkey", "text": "With a sharp knife, cut {turkey} into 2 airline breasts (boneless, with the drumette attached) and 2 leg quarters (thigh and drumstick kept together). Save the carcass, neck and wings for stock and the giblets for gravy."}, {"title": "Weigh and mix the brine", "text": "Weigh the breasts and the legs separately. For each, mix kosher salt at 1% and sugar at 0.5% of that weight in its own small bowl. For example, 2 kg of breasts needs 20 g salt and 10 g sugar."}, {"title": "Presear", "text": "Heat half of {oil1} in the skillet over medium-high heat until shimmering. Lay in one breast skin-side down, press it firmly against the pan and cook, rotating now and then, until golden, about 90 seconds. Repeat with the second breast. Wipe the pan, add the rest of the oil and sear the leg quarters the same way. Return everything skin-side up to the sheet pan."}, {"title": "Season and bag", "text": "Season the breasts and legs with their own salt-sugar mix. Put the legs in one bag and the breasts in another, in a single layer. Add half of {oil2} to each bag and massage to coat. Tuck {sage} against the flesh side, if using. Seal by water displacement or vacuum sealer, then refrigerate the breasts."}, {"title": "Cook the legs", "text": "Submerge the bag of legs, clip it to the side and cover the container. Cook for at least 8 and up to 12 hours.", "timer": 480}, {"title": "Make stock (optional)", "text": "While the legs cook, put the carcass, neck and wings in a stockpot with {onion} and {peppercorns}. Cover with water by at least 5 cm (2 in), bring to a boil, then simmer gently for about 4 hours, skimming now and then. Off the heat, add {sage2} and {thyme} and steep 15 minutes. Skim off the fat, strain and cool. Keeps 1 week in the fridge or 6 months frozen.", "timer": 240}, {"title": "Add the breasts", "text": "Lower the bath to 55°C (131°F), leaving the legs in. Add the bag of breasts right away; no need to wait for the water to cool. Cover and cook for 16 to 24 hours. The breasts can hold another 4 hours with no loss in quality.", "timer": 960}, {"title": "Sear", "text": "Take the turkey out of the bags and pat dry. Heat half of {oil3} in the skillet over medium-high heat and sear the breasts skin-side down, pressing firmly, until golden and crisp, about 90 seconds. Wipe the pan, add the rest of the oil and sear the legs the same way."}, {"title": "Carve and serve", "text": "Slice the breasts as thick as you like; thick slices work well since the meat is so juicy. Cut the legs at the knee joint to separate thigh and drumstick, and carve around the thigh bone for smaller portions. Arrange on a platter and serve."}], "tips": ["Short on time? Cook the legs at 75°C (167°F) for 7 hours and the breasts at 55°C (131°F) for 8 hours. The longer times give the best results.", "Cooking only legs: 24 hours at 65°C (149°F). They can then hold at 55°C (131°F) for 12 more hours.", "Poultry held above 54°C (130°F) for long enough is fully pasteurized, and these cook times are well past that.", "Pinkish juices are normal at these temperatures.", "Ask your butcher to break down the bird, keeping thigh and drumstick together."], "makeAhead": [{"title": "Timeline", "text": "Day before, morning: heat the bath, break down, presear, brine, bag and start the legs. Evening (8–12 hours later): drop to 55°C (131°F) and add the breasts. Next day, 20 minutes before eating: unbag, sear and carve."}, {"title": "Cook up to 4 days ahead", "text": "Chill the cooked bags in an ice bath for 30–60 minutes, then refrigerate for up to 4 days or freeze for up to a year. Reheat in a 52°C (126°F) bath for 90 minutes to 2 hours, then sear and serve."}], "source": "ChefSteps", "image": "img/sous-vide-holiday-turkey.jpg", "added": "2026-10-12"}, {"id": "peruvian-roast-chicken", "title": "Peruvian Roast Chicken with Garlic and Lime", "category": "Mains", "description": "Pollo a la brasa at home: a whole chicken rubbed under and over the skin with a garlicky lime, mint and smoked paprika paste, then roasted upright until crisp and served with a creamy green ají verde.", "servings": 4, "servingWord": "servings", "yieldNote": "Serves 4", "activeTime": 20, "totalTime": 465, "equipment": ["Blender", "Gallon zip-top bag", "Vertical poultry roaster (or a 12 oz / 355 ml can of beer)", "Rimmed baking sheet", "Instant-read thermometer", "Foil"], "groups": [{"name": "Paste", "items": [{"key": "oil", "qty": 45, "unit": "ml", "name": "extra-virgin olive oil", "short": "olive oil", "us": {"qty": 3, "unit": "tbsp"}}, {"key": "mint", "qty": 60, "unit": "ml", "name": "fresh mint leaves, lightly packed", "short": "mint leaves", "us": {"qty": 0.25, "unit": "cup"}}, {"key": "salt", "qty": 2, "unit": "tbsp", "name": "kosher salt", "short": "kosher salt"}, {"key": "garlic", "qty": 6, "name": "medium garlic cloves, peeled and roughly chopped", "short": "garlic cloves"}, {"key": "pepper", "qty": 1, "unit": "tbsp", "name": "ground black pepper", "short": "black pepper"}, {"key": "cumin", "qty": 1, "unit": "tbsp", "name": "ground cumin", "short": "cumin"}, {"key": "sugar", "qty": 1, "unit": "tbsp", "name": "sugar", "short": "sugar"}, {"key": "paprika", "qty": 2, "unit": "tsp", "name": "smoked paprika", "short": "smoked paprika"}, {"key": "oregano", "qty": 2, "unit": "tsp", "name": "dried oregano", "short": "dried oregano"}, {"key": "zest", "qty": 2, "unit": "tsp", "name": "finely grated lime zest", "short": "lime zest"}, {"key": "lime", "qty": 60, "unit": "ml", "name": "fresh lime juice", "short": "lime juice", "us": {"qty": 0.25, "unit": "cup"}, "note": "2 limes give enough zest and juice"}, {"key": "habanero", "qty": 1, "unit": "tsp", "name": "habanero chile, minced", "short": "minced habanero", "note": "or 1 tbsp minced serrano"}]}, {"name": "Chicken", "items": [{"key": "chicken", "qty": 1, "name": "whole chicken (1.6–1.8 kg / 3½–4 lb)", "short": "whole chicken"}, {"key": "water", "qty": 240, "unit": "ml", "name": "water, for the pan", "short": "water", "us": {"qty": 1, "unit": "cup"}, "note": "plus more as needed"}]}, {"name": "Ají verde (green sauce)", "items": [{"key": "cilantro", "qty": 1, "name": "bunch fresh cilantro, leaves and tender stems", "short": "bunch cilantro"}, {"key": "jalapenos", "qty": 2, "name": "jalapeños, roughly chopped", "short": "jalapeños", "note": "seed them for a milder sauce"}, {"key": "mayo", "qty": 120, "unit": "ml", "name": "mayonnaise", "short": "mayonnaise", "us": {"qty": 0.5, "unit": "cup"}}, {"key": "cheese", "qty": 30, "unit": "g", "name": "queso fresco or cotija, crumbled", "short": "queso fresco", "us": {"qty": 0.25, "unit": "cup"}}, {"key": "lime2", "qty": 15, "unit": "ml", "name": "fresh lime juice", "short": "lime juice", "us": {"qty": 1, "unit": "tbsp"}}, {"key": "garlic2", "qty": 1, "name": "garlic clove", "short": "garlic clove"}, {"key": "salt2", "qty": 0.25, "unit": "tsp", "name": "salt", "short": "salt", "note": "plus more to taste"}]}], "steps": [{"title": "Make the paste", "text": "Blend {oil}, {mint}, {salt}, {garlic}, {pepper}, {cumin}, {sugar}, {paprika}, {oregano}, {zest}, {lime} and {habanero} until smooth, 10–20 seconds. Wear gloves when handling the chile."}, {"title": "Paste and marinate", "text": "With your fingers or the handle of a wooden spoon, loosen the skin over the thighs and breast of {chicken}, pulling off any excess fat. Rub half the paste directly onto the meat under the skin, then spread the rest all over the outside. Tuck the wingtips underneath. Seal in a gallon zip-top bag and refrigerate for at least 6 and up to 24 hours.", "timer": 360}, {"title": "Slow roast", "text": "Set a rack in the lowest position and heat the oven to 165°C / 145°C fan / gas 3 (325°F). Stand the vertical roaster on a rimmed baking sheet and slide the chicken on so it sits upright. Roast until the skin just starts to turn golden and the thickest part of the breast reaches 60°C (140°F), 45–55 minutes.", "timer": 50}, {"title": "Turn up the heat", "text": "Carefully take the chicken and pan out of the oven and raise the temperature to 260°C / 240°C fan / gas 9 (500°F)."}, {"title": "Crisp the skin", "text": "Once the oven is hot, pour {water} into the pan and return it to the oven. Roast until the skin is browned and crisp, the breast reaches 71°C (160°F) and the thigh 79°C (175°F), about 20 minutes. Turn the bird around halfway through, and add more water if the pan starts to smoke.", "timer": 20}, {"title": "Make the ají verde", "text": "While the chicken roasts, blend {cilantro}, {jalapenos}, {mayo}, {cheese}, {lime2}, {garlic2} and {salt2} until smooth and bright green. Taste and add more salt or lime if needed, and thin with a splash of water if it's too thick. Chill until serving."}, {"title": "Rest and carve", "text": "Let the chicken rest on the roaster for 20 minutes. Using a kitchen towel, lift it off onto a platter or board, carve and serve with the ají verde.", "timer": 20}], "variations": ["Serve with fries and a simple salad for a classic pollo a la brasa plate."], "tips": ["No vertical roaster? Open a 12 oz (355 ml) can of beer, pour out (or drink) about half, spray the can with cooking spray and stand the chicken on it.", "If the top browns too fast, lay an 18 cm (7 in) square of foil over the neck and wingtips.", "Mint and oregano stand in for Peruvian black mint, and smoked paprika mimics the wood-fired flavor of a rotisserie."], "makeAhead": [{"title": "Marinate ahead", "text": "Paste the chicken up to 24 hours before roasting; the longer rest seasons it more deeply and dries the skin for better crisping."}, {"title": "Ají verde", "text": "Make up to 3 days ahead and keep covered in the fridge. Stir before serving. Not suited to freezing."}, {"title": "Leftovers", "text": "Keep carved chicken in the fridge for up to 3 days or freeze for up to 3 months. Reheat at 180°C / 350°F until hot."}], "source": "Cook's Illustrated, March 2011", "image": "img/peruvian-roast-chicken.jpg", "added": "2026-10-12"}, {"id": "salted-butterscotch-chocolate-chunk-cookies", "title": "Salted Butterscotch Chocolate Chunk Cookies", "category": "Desserts", "description": "Big, chewy brown-butter cookies loaded with dark and milk chocolate chunks and toffee bits, finished with flaky salt.", "servings": 18, "servingWord": "cookies", "yieldNote": "Makes 18 large cookies", "activeTime": 30, "totalTime": 435, "equipment": ["Medium saucepan", "Heatproof liquid measuring cup", "Medium bowl", "Large bowl", "Whisk", "¼-cup cookie scoop", "2 large rimmed baking sheets", "Parchment paper", "Wire rack"], "groups": [{"name": "Brown butter", "items": [{"key": "butter", "qty": 284, "unit": "g", "name": "salted butter", "short": "butter", "us": {"qty": 1.25, "unit": "cup"}, "note": "or unsalted, see Notes"}, {"name": "Ice cubes or cold water, as needed"}, {"key": "vanilla", "qty": 15, "unit": "ml", "name": "vanilla extract", "short": "vanilla extract", "us": {"qty": 1, "unit": "tbsp"}}]}, {"name": "Dry ingredients", "items": [{"key": "flour", "qty": 445, "unit": "g", "name": "all-purpose flour", "short": "flour", "us": {"qty": 3.5, "unit": "cup"}}, {"key": "bpowder", "qty": 1.5, "unit": "tsp", "name": "baking powder", "short": "baking powder"}, {"key": "bsoda", "qty": 1.25, "unit": "tsp", "name": "baking soda", "short": "baking soda"}]}, {"name": "Dough", "items": [{"key": "brown", "qty": 275, "unit": "g", "name": "dark brown sugar", "short": "dark brown sugar", "us": {"qty": 1.25, "unit": "cup"}, "note": "packed"}, {"key": "white", "qty": 150, "unit": "g", "name": "granulated sugar", "short": "granulated sugar", "us": {"qty": 0.75, "unit": "cup"}}, {"key": "eggs", "qty": 2, "name": "large eggs", "short": "eggs"}]}, {"name": "Mix-ins", "items": [{"key": "dark", "qty": 170, "unit": "g", "name": "70% dark chocolate, coarsely chopped", "short": "chopped dark chocolate", "us": {"qty": 6, "unit": "oz"}, "note": "about 1 cup"}, {"key": "milk", "qty": 170, "unit": "g", "name": "milk chocolate, coarsely chopped", "short": "chopped milk chocolate", "us": {"qty": 6, "unit": "oz"}, "note": "about 1 cup"}, {"key": "toffee", "qty": 217, "unit": "g", "name": "store-bought toffee bits", "short": "toffee bits", "us": {"qty": 1.5, "unit": "cup"}, "note": "or homemade toffee cut into 1 cm (½ in) pieces"}]}, {"name": "To finish", "items": [{"name": "Flaky sea salt"}]}], "steps": [{"title": "Brown the butter", "text": "Melt {butter} in a medium saucepan over medium heat. Once it's bubbling hard, keep cooking and swirling now and then until the bubbles settle into foam and toasty brown flecks float on top, 6–8 minutes.", "timer": 8}, {"title": "Top up and cool", "text": "Take the pan off the heat and scrape up the browned bits from the bottom. Pour everything into a heatproof liquid measuring cup, then add a couple of ice cubes (or about 2 tbsp cold water) to bring it up to 300 ml (1¼ cups). Stir in {vanilla} and let it cool a little."}, {"title": "Mix the dry ingredients", "text": "In a medium bowl, whisk together {flour}, {bpowder} and {bsoda}."}, {"title": "Make the dough", "text": "In a large bowl, whisk {brown} and {white} with the brown butter until well combined. Whisk in {eggs} one at a time until the mixture is very smooth, about 1 minute. Add the flour mixture and mix until fully combined, then fold in {dark}, {milk} and {toffee}."}, {"title": "Scoop and chill", "text": "Scoop ¼-cup mounds of dough (about 100 g each) onto a baking sheet. Wrap the sheet tightly and refrigerate for at least 6 hours, or up to 48 hours.", "timer": 360}, {"title": "Heat the oven", "text": "When you're ready to bake, heat the oven to 180°C / 160°C fan / gas 4 (350°F) with racks in the upper and lower thirds. Line 2 large rimmed baking sheets with parchment."}, {"title": "Bake", "text": "Put 6 dough balls on each sheet. Bake for 18–20 minutes, swapping the sheets between racks and turning them halfway, until the cookies have spread a little and the edges are golden.", "timer": 20}, {"title": "Salt and cool", "text": "Sprinkle the hot cookies with flaky sea salt right away. Let them sit on the sheets for at least 10 minutes, then move to a wire rack to cool completely.", "timer": 10}, {"title": "Bake the rest", "text": "Bake the remaining 6 dough balls on a single sheet the same way, then salt and cool them.", "timer": 20}], "tips": ["Salted butter gives a nicely even seasoning. If you use unsalted, add 1¼ tsp kosher salt (such as Diamond Crystal) to the flour mixture."], "makeAhead": [{"title": "Make the dough ahead", "text": "The scooped dough keeps, tightly wrapped, in the fridge for up to 48 hours."}, {"title": "Freeze", "text": "Freeze the dough balls, then bag them. Bake straight from frozen for about 20–22 minutes."}, {"title": "Store", "text": "Baked cookies keep, covered at room temperature, for up to 3 days."}], "source": "NYT Cooking", "image": "img/salted-butterscotch-chocolate-chunk-cookies.jpg", "added": "2026-10-12"}, {"id": "pepperoni-lovers-french-bread-pizza", "title": "Pepperoni Lover's French Bread Pizza", "category": "Mains", "description": "Garlic-oil-toasted French bread topped with a quick no-cook tomato sauce, mozzarella, Parmesan and pepperoni, finished under the broiler.", "servings": 4, "servingWord": "servings", "yieldNote": "Serves 4", "activeTime": 15, "totalTime": 25, "equipment": ["Medium bowl (x2)", "Small pot", "Pastry brush", "Rimmed baking sheet"], "groups": [{"name": "No-cook sauce", "items": [{"key": "tomatoes", "qty": 1, "name": "can (14 oz / 400 g) petite diced tomatoes, drained", "short": "drained tomatoes"}, {"key": "garlic1", "qty": 1, "name": "garlic clove, grated", "short": "garlic"}, {"key": "salt", "qty": 0.5, "unit": "tsp", "name": "kosher salt", "short": "salt", "note": "Diamond Crystal"}, {"key": "oregano", "qty": 0.5, "unit": "tsp", "name": "dried oregano", "short": "oregano"}, {"key": "oil1", "qty": 15, "unit": "ml", "name": "olive oil", "short": "olive oil", "us": {"qty": 1, "unit": "tbsp"}}, {"name": "A few grinds of black pepper"}]}, {"name": "Pizza", "items": [{"key": "oil2", "qty": 60, "unit": "ml", "name": "olive oil", "short": "olive oil", "us": {"qty": 0.25, "unit": "cup"}}, {"key": "garlic2", "qty": 2, "name": "garlic cloves, grated", "short": "garlic"}, {"key": "bread", "qty": 1, "name": "loaf soft French bread, split lengthwise, insides mostly dug out", "short": "French bread halves"}, {"key": "mozz", "qty": 113, "unit": "g", "name": "mozzarella, grated or torn", "short": "mozzarella", "us": {"qty": 4, "unit": "oz"}, "note": "low-moisture part-skim, or fresh (drained and patted dry); about 1 cup"}, {"key": "parm", "qty": 2, "unit": "tbsp", "name": "grated Parmesan", "short": "Parmesan", "note": "plus more for serving"}, {"key": "pepperoni", "qty": 57, "unit": "g", "name": "sliced pepperoni, quartered", "short": "pepperoni", "us": {"qty": 2, "unit": "oz"}, "note": "about ½ cup"}]}, {"name": "To serve", "items": [{"name": "Extra grated Parmesan"}, {"name": "Red-pepper flakes and/or dried oregano"}]}], "steps": [{"title": "Make the sauce", "text": "Heat the oven to 230°C / 210°C fan / gas 8 (450°F) with a rack in the middle. In a medium bowl, stir together {tomatoes}, {garlic1}, {salt}, {oregano}, {oil1} and a few grinds of black pepper. Set aside."}, {"title": "Make the garlic oil", "text": "Warm {oil2} and {garlic2} in a small pot over medium heat, swirling now and then, just until the garlic sizzles but before it browns, 2–4 minutes. Take it off the heat.", "timer": 4}, {"title": "Toast the bread", "text": "Lay {bread} cut side up on a baking sheet and brush the cut sides with the garlic oil. Bake until the edges turn golden, 5–7 minutes.", "timer": 7}, {"title": "Top the pizzas", "text": "Toss {mozz}, {parm} and {pepperoni} together in a medium bowl. Spread the sauce over both bread halves right out to the edges, then scatter the cheese and pepperoni on top."}, {"title": "Bake", "text": "Return the pan to the oven and bake until the cheese melts, about 5 minutes.", "timer": 5}, {"title": "Broil", "text": "Switch the oven to broil and broil, watching closely, until the cheese is bubbling and browned in spots, 1–2 minutes.", "timer": 2}, {"title": "Rest and serve", "text": "Let cool for 5 minutes, then slice. Finish with more Parmesan, red-pepper flakes and oregano if you like.", "timer": 5}], "tips": ["Draining the tomatoes is what keeps the sauce from making the bread soggy.", "The same amount of crushed or whole peeled tomatoes works instead of diced. Break whole ones up by hand and drain off any extra liquid.", "Short on time? Your favorite jarred marinara can stand in for the sauce."], "makeAhead": [{"title": "Sauce", "text": "The sauce keeps, tightly covered in the fridge, for about 5 days."}, {"title": "Reheat", "text": "Warm leftover pizza in a 175°C (350°F) oven until heated through."}], "source": "NYT Cooking (Dawn Perry)", "image": "img/pepperoni-lovers-french-bread-pizza.jpg", "added": "2026-10-13"}, {"id": "pork-chile-verde", "title": "Pork Chile Verde", "category": "Mains", "description": "Pork shoulder braised until tender in a smoky green sauce of charred tomatillos, poblanos, jalapeño, garlic and cilantro.", "servings": 4, "servingWord": "servings", "yieldNote": "Serves 4", "activeTime": 15, "totalTime": 150, "equipment": ["Large rimmed sheet pan", "Small bowl and plastic wrap (or a resealable bag)", "Blender", "Large Dutch oven"], "groups": [{"name": "Charred tomatillo sauce", "items": [{"key": "tomatillos", "qty": 454, "unit": "g", "name": "tomatillos, husks removed", "short": "tomatillos", "us": {"qty": 1, "unit": "lb"}}, {"key": "poblanos", "qty": 3, "name": "poblano chiles, stemmed", "short": "poblanos"}, {"key": "jalapeno", "qty": 1, "name": "jalapeño, stemmed", "short": "jalapeño"}, {"key": "garlic", "qty": 3, "name": "large garlic cloves, peeled", "short": "garlic"}, {"key": "oil1", "qty": 15, "unit": "ml", "name": "extra-virgin olive oil", "short": "olive oil", "us": {"qty": 1, "unit": "tbsp"}}, {"key": "cilantro", "qty": 1, "unit": "cup", "name": "cilantro leaves and tender stems, loosely packed", "short": "cilantro"}, {"name": "Salt"}]}, {"name": "Stew", "items": [{"key": "oil2", "qty": 30, "unit": "ml", "name": "extra-virgin olive oil", "short": "olive oil", "us": {"qty": 2, "unit": "tbsp"}}, {"key": "pork", "qty": 680, "unit": "g", "name": "pork shoulder or butt, cut into 1-inch (2.5 cm) cubes", "short": "pork", "us": {"qty": 1.5, "unit": "lb"}}, {"key": "onion", "qty": 1.5, "unit": "cup", "name": "finely chopped sweet onion", "short": "onion", "note": "such as Vidalia"}, {"key": "cumin", "qty": 1, "unit": "tsp", "name": "ground cumin", "short": "cumin"}, {"key": "oregano", "qty": 1, "unit": "tsp", "name": "dried oregano", "short": "oregano"}, {"key": "broth", "qty": 475, "unit": "ml", "name": "low-sodium chicken broth", "short": "chicken broth", "us": {"qty": 2, "unit": "cup"}}, {"name": "Salt and pepper"}]}, {"name": "To serve", "items": [{"name": "Chopped cilantro leaves"}, {"name": "Cooked rice"}]}], "steps": [{"title": "Prep for broiling", "text": "Turn the broiler to high with a rack about 6 inches (15 cm) below it. On a large rimmed sheet pan, toss {tomatillos}, {poblanos}, {jalapeno} and {garlic} with {oil1} and a good pinch of salt."}, {"title": "Char the vegetables", "text": "Broil, flipping everything halfway, until well charred in spots, about 15 minutes.", "timer": 15}, {"title": "Steam the poblanos", "text": "Move the poblanos to a small bowl, cover tightly with plastic wrap (or seal them in a bag) and let them steam for 5 minutes.", "timer": 5}, {"title": "Blend the sauce", "text": "Peel the poblanos and discard the skins. Put them in a blender with the tomatillos, jalapeño and garlic, scraping in all the caramelized juices from the pan, which carry a lot of flavor. Add {cilantro} and blend until smooth."}, {"title": "Heat the oven", "text": "Heat the oven to 165°C / 145°C fan / gas 3 (325°F)."}, {"title": "Brown the pork", "text": "Heat {oil2} in a large Dutch oven over medium. Season {pork} with salt and pepper. Brown half of it, turning now and then, about 5 minutes, then move to a plate and repeat with the rest.", "timer": 5}, {"title": "Build the stew", "text": "Add {onion} to the empty pot and cook, stirring occasionally, until softened, about 3 minutes. Stir in {cumin} and {oregano} for 1 minute until fragrant. Return the pork and any juices, pour in {broth} and the tomatillo sauce, and season with salt and pepper.", "timer": 3}, {"title": "Braise", "text": "Bring to a boil, cover and move to the oven. Braise until the pork is very tender, about 1½ hours. Taste and adjust the salt and pepper.", "timer": 90}, {"title": "Serve", "text": "Spoon into shallow bowls, scatter with chopped cilantro and serve warm with rice."}], "tips": ["Pick tomatillos that are plump, firm and unblemished. Soft ones are overripe.", "No poblanos? Anaheim or Cubanelle peppers work instead.", "Sweet onion is used on purpose: its extra sugar balances the tart tomatillos."], "makeAhead": [{"title": "Leftovers", "text": "Tuck leftover chile verde into warm tortillas for tacos the next day."}], "source": "NYT Cooking (Kay Chun)", "image": "img/pork-chile-verde.jpg", "added": "2026-10-13"}, {"id": "garlic-butter-steak-bites", "title": "Garlic Butter Steak Bites", "category": "Mains", "description": "Bite-size steak marinated in soy sauce and olive oil, seared hard in cast iron, then tossed off the heat with butter, garlic and parsley.", "servings": 4, "servingWord": "servings", "yieldNote": "Serves 4", "activeTime": 25, "totalTime": 60, "equipment": ["Large bowl", "12-inch (30 cm) cast-iron or heavy skillet", "Slotted spoon", "Tongs"], "groups": [{"name": "Marinade", "items": [{"key": "oil", "qty": 60, "unit": "ml", "name": "olive oil", "short": "olive oil", "us": {"qty": 0.25, "unit": "cup"}}, {"key": "soy", "qty": 3, "unit": "tbsp", "name": "soy sauce", "short": "soy sauce"}, {"key": "steak", "qty": 680, "unit": "g", "name": "sirloin or flank steak, excess fat trimmed, cut into 1-inch (2.5 cm) pieces", "short": "steak", "us": {"qty": 1.5, "unit": "lb"}}]}, {"name": "To finish", "items": [{"key": "butter", "qty": 1, "unit": "tbsp", "name": "unsalted butter", "short": "butter"}, {"key": "garlic", "qty": 2, "name": "large garlic cloves, minced or grated", "short": "garlic"}, {"name": "Chopped fresh parsley leaves and tender stems"}, {"name": "Flaky salt and freshly cracked black pepper"}]}], "steps": [{"title": "Marinate", "text": "In a large bowl, stir together {oil} and {soy}. Add {steak} and toss to coat. Leave on the counter for 30 minutes, or refrigerate for 1 hour or up to overnight, stirring now and then.", "timer": 30}, {"title": "Heat the pan", "text": "Set a 12-inch (30 cm) cast-iron or heavy skillet over medium-high heat for 2 minutes, until very hot.", "timer": 2}, {"title": "Sear the steak", "text": "Lift the steak out with a slotted spoon, letting excess marinade drip off, and lay it in the pan in a single layer. Work in batches if needed so the pan isn't crowded. Cook until browned, 5–6 minutes, flipping pieces with tongs once they release easily.", "timer": 6}, {"title": "Butter and garlic", "text": "If you cooked in batches, return all the meat and its juices to the pan. Take the pan off the heat, add {butter} and {garlic}, and toss the steak around until everything is coated, about 1 minute.", "timer": 1}, {"title": "Serve", "text": "Pile onto a serving plate and drizzle with any sauce left in the pan. Finish with parsley, a pinch of flaky salt and a few grinds of pepper. Add toothpicks for easy snacking, if you like."}], "tips": ["Small pieces mean more surface area, so the steak takes on the marinade quickly and cooks in minutes.", "Give the bites room in the pan. Crowding steams them instead of browning them.", "Good with a lemony grain salad or corn salad, plus bread to mop up the garlic butter."], "makeAhead": [{"title": "Marinate ahead", "text": "The steak can marinate in the fridge overnight, so it's ready to sear straight away."}], "source": "NYT Cooking (Yasmin Fahr)", "image": "img/garlic-butter-steak-bites.jpg", "added": "2026-10-13"}, {"id": "pumpkin-bread", "title": "Pumpkin Bread", "category": "Breads", "description": "Moist, tangy pumpkin quick bread with cream cheese, buttermilk and walnuts under a crunchy cinnamon-sugar topping.", "servings": 2, "servingWord": "loaves", "yieldNote": "Makes 2 loaves", "activeTime": 30, "totalTime": 195, "equipment": ["Large saucepan", "2 mixing bowls", "Whisk", "Rubber spatula", "Two 8½ × 4½-inch (22 × 11 cm) loaf pans", "Skewer", "Wire rack"], "groups": [{"name": "Topping", "items": [{"key": "tsugar", "qty": 64, "unit": "g", "name": "light brown sugar", "short": "light brown sugar", "us": {"qty": 5, "unit": "tbsp"}, "note": "packed"}, {"key": "tflour", "qty": 8, "unit": "g", "name": "all-purpose flour", "short": "flour", "us": {"qty": 1, "unit": "tbsp"}}, {"key": "tbutter", "qty": 14, "unit": "g", "name": "unsalted butter, softened", "short": "softened butter", "us": {"qty": 1, "unit": "tbsp"}}, {"key": "tcinn", "qty": 1, "unit": "tsp", "name": "ground cinnamon", "short": "cinnamon"}, {"key": "tsalt", "qty": 0.125, "unit": "tsp", "name": "salt", "short": "salt"}]}, {"name": "Dry ingredients", "items": [{"key": "flour", "qty": 285, "unit": "g", "name": "all-purpose flour", "short": "flour", "us": {"qty": 2, "unit": "cup"}}, {"key": "bpowder", "qty": 1.5, "unit": "tsp", "name": "baking powder", "short": "baking powder"}, {"key": "bsoda", "qty": 0.5, "unit": "tsp", "name": "baking soda", "short": "baking soda"}]}, {"name": "Pumpkin mixture", "items": [{"key": "pumpkin", "qty": 425, "unit": "g", "name": "unsweetened pumpkin puree", "short": "pumpkin puree", "us": {"qty": 15, "unit": "oz"}, "note": "one 15-oz can"}, {"key": "salt", "qty": 1, "unit": "tsp", "name": "salt", "short": "salt"}, {"key": "cinn", "qty": 1.5, "unit": "tsp", "name": "ground cinnamon", "short": "cinnamon"}, {"key": "nutmeg", "qty": 0.25, "unit": "tsp", "name": "ground nutmeg", "short": "nutmeg"}, {"key": "cloves", "qty": 0.125, "unit": "tsp", "name": "ground cloves", "short": "cloves"}, {"key": "sugar", "qty": 200, "unit": "g", "name": "granulated sugar", "short": "granulated sugar", "us": {"qty": 1, "unit": "cup"}}, {"key": "brown", "qty": 200, "unit": "g", "name": "light brown sugar", "short": "light brown sugar", "us": {"qty": 1, "unit": "cup"}, "note": "packed"}, {"key": "oil", "qty": 120, "unit": "ml", "name": "vegetable oil", "short": "vegetable oil", "us": {"qty": 0.5, "unit": "cup"}}, {"key": "cream", "qty": 113, "unit": "g", "name": "cream cheese", "short": "cream cheese", "us": {"qty": 4, "unit": "oz"}, "note": "cut into 12 pieces"}]}, {"name": "To finish the batter", "items": [{"key": "eggs", "qty": 4, "name": "large eggs", "short": "eggs"}, {"key": "buttermilk", "qty": 60, "unit": "ml", "name": "buttermilk", "short": "buttermilk", "us": {"qty": 0.25, "unit": "cup"}}, {"key": "walnuts", "qty": 115, "unit": "g", "name": "walnuts, toasted and finely chopped", "short": "chopped toasted walnuts", "us": {"qty": 1, "unit": "cup"}}]}], "steps": [{"title": "Make the topping", "text": "In a small bowl, rub together {tsugar}, {tflour}, {tbutter}, {tcinn} and {tsalt} with your fingers until well combined and the mixture looks like wet sand. Set aside."}, {"title": "Heat the oven", "text": "Set a rack in the middle of the oven and heat to 180°C / 160°C fan / gas 4 (350°F). Grease two 8½ × 4½-inch loaf pans."}, {"title": "Mix the dry ingredients", "text": "In a bowl, whisk together {flour}, {bpowder} and {bsoda}."}, {"title": "Cook down the pumpkin", "text": "In a large saucepan over medium heat, combine {pumpkin}, {salt}, {cinn}, {nutmeg} and {cloves}. Cook, stirring constantly, until reduced to about 1½ cups (360 ml) for a full batch, 6–8 minutes.", "timer": 8}, {"title": "Add sugars and cream cheese", "text": "Take the pan off the heat and stir in {sugar}, {brown}, {oil} and {cream} until combined. Let it stand for 5 minutes, then whisk until no pieces of cream cheese remain and the mixture is smooth.", "timer": 5}, {"title": "Add the eggs", "text": "Whisk {eggs} and {buttermilk} together, then whisk them into the pumpkin mixture."}, {"title": "Fold in flour and nuts", "text": "Fold the flour mixture into the pumpkin mixture until just combined. A few small lumps of flour are fine. Fold in {walnuts}."}, {"title": "Bake", "text": "Scrape the batter into the prepared pans and sprinkle the topping evenly over each loaf. Bake for 45–50 minutes, until a skewer in the center comes out clean.", "timer": 50}, {"title": "Cool in the pans", "text": "Let the loaves cool in their pans on a wire rack for 20 minutes.", "timer": 20}, {"title": "Cool completely", "text": "Turn the loaves out of the pans and let them cool for at least 1½ hours. Serve warm or at room temperature.", "timer": 90}], "tips": ["Cooking down the canned pumpkin gets rid of its raw, tinny taste, and you mix the whole batter right in the pot.", "Cream cheese and buttermilk add a gentle tang. The topping adds crunch and keeps the loaves from turning soggy the next day.", "Using 9 × 5-inch loaf pans? Start checking for doneness 5 minutes early."], "makeAhead": [{"title": "Store", "text": "Once fully cool, wrap the loaves tightly and keep at room temperature for up to 3 days."}, {"title": "Freeze", "text": "Wrap cooled loaves in plastic wrap, then foil, and freeze for up to 1 month. Thaw at room temperature."}], "source": "Cook's Illustrated, September 2012", "image": "img/pumpkin-bread.jpg", "added": "2026-10-17"}, {"id": "baja-fried-fish-tacos", "title": "Baja Fried-Fish Tacos", "category": "Mains", "description": "Crisp beer-battered white fish in doubled corn tortillas with a lime-cilantro cabbage slaw and smoky chipotle tartar sauce.", "servings": 8, "servingWord": "tacos", "yieldNote": "Makes 6–8 tacos", "activeTime": 45, "totalTime": 45, "equipment": ["Large bowl", "Blender", "Whisk", "10–12-inch (25–30 cm) nonstick frying pan with sides at least 2 in (5 cm) tall", "Deep-fry thermometer", "Fork", "Slotted spoon", "Baking sheet lined with paper towels"], "groups": [{"name": "Beer batter", "items": [{"key": "beer", "qty": 240, "unit": "ml", "name": "dark beer", "short": "dark beer", "us": {"qty": 1, "unit": "cup"}}, {"key": "flour", "qty": 125, "unit": "g", "name": "all-purpose flour", "short": "flour", "us": {"qty": 1, "unit": "cup"}}, {"key": "salt", "qty": 1, "unit": "tsp", "name": "salt", "short": "salt"}]}, {"name": "Fish", "items": [{"key": "fish", "qty": 680, "unit": "g", "name": "boneless, skinless firm white fish, such as Pacific cod or tilapia", "short": "fish", "us": {"qty": 1.5, "unit": "lb"}}, {"name": "Vegetable oil, for frying (about 1 in / 2.5 cm deep)"}]}, {"name": "Cabbage and cilantro slaw", "items": [{"key": "cabbage", "qty": 285, "unit": "g", "name": "cabbage, finely shredded", "short": "shredded cabbage", "us": {"qty": 10, "unit": "oz"}, "note": "about 1½ quarts"}, {"key": "cilantro", "qty": 15, "unit": "g", "name": "fresh cilantro, chopped", "short": "chopped cilantro", "us": {"qty": 0.333, "unit": "cup"}}, {"key": "limejuice", "qty": 45, "unit": "ml", "name": "lime juice", "short": "lime juice", "us": {"qty": 3, "unit": "tbsp"}}, {"key": "slawoil", "qty": 30, "unit": "ml", "name": "vegetable oil", "short": "vegetable oil", "us": {"qty": 2, "unit": "tbsp"}}, {"key": "chile", "qty": 0.25, "unit": "tsp", "name": "hot chile flakes", "short": "chile flakes"}, {"name": "Salt, to taste"}]}, {"name": "Chipotle tartar sauce", "items": [{"key": "chipotle", "qty": 2, "unit": "tbsp", "name": "canned chipotle chiles", "short": "canned chipotle chiles"}, {"key": "mayo", "qty": 240, "unit": "ml", "name": "mayonnaise", "short": "mayonnaise", "us": {"qty": 1, "unit": "cup"}}, {"key": "relish", "qty": 60, "unit": "ml", "name": "sweet pickle relish", "short": "sweet pickle relish", "us": {"qty": 0.25, "unit": "cup"}}, {"key": "onion", "qty": 40, "unit": "g", "name": "onion, chopped", "short": "chopped onion", "us": {"qty": 0.25, "unit": "cup"}}]}, {"name": "To serve", "items": [{"key": "tortillas", "qty": 16, "name": "corn tortillas, warmed", "short": "corn tortillas", "note": "12–16, two per taco"}, {"name": "Lime wedges"}]}], "steps": [{"title": "Make the slaw", "text": "In a large bowl, mix {cabbage}, {cilantro}, {limejuice}, {slawoil} and {chile}. Season with salt to taste. A full batch makes about 4¼ cups."}, {"title": "Make the chipotle tartar sauce", "text": "Rinse {chipotle} and discard the seeds and veins. Blend the chiles with {mayo}, {relish} and {onion} until smooth. A full batch makes about 1⅓ cups."}, {"title": "Make the batter", "text": "In a bowl, whisk {beer}, {flour} and {salt} until well blended."}, {"title": "Prep the fish", "text": "Rinse {fish} and pat dry, then cut crosswise into 1-inch (2.5 cm) strips."}, {"title": "Heat the oil", "text": "Heat the oven to 95°C / 75°C fan / gas ¼ (200°F) for keeping the fish warm. Pour about 1 inch (2.5 cm) of oil into the frying pan and heat over medium-high to 180°C (360°F)."}, {"title": "Fry the fish", "text": "With a fork, dip each piece of fish into the batter, lift it out and let the excess drip off. Slide a few pieces at a time into the oil and fry until golden, turning as needed to brown all sides, 2–4 minutes per batch. Adjust the heat to keep the oil at 180°C (360°F). Lift out with a slotted spoon onto the lined baking sheet and keep warm in the oven while you fry the rest.", "timer": 4}, {"title": "Assemble", "text": "For each taco, stack two warm {tortillas}, add a couple of pieces of fish and top with a spoonful of slaw. Serve with the chipotle tartar sauce and lime wedges for squeezing over."}], "tips": ["Use a pan with sides at least 2 inches (5 cm) tall so the oil doesn't spatter over.", "Fry in small batches. Crowding the pan drops the oil temperature and makes the coating greasy.", "Doubling the tortillas keeps the tacos from splitting under the fish and slaw."], "makeAhead": [{"title": "Sauce and slaw", "text": "The chipotle tartar sauce keeps covered in the fridge for a few days. Make the slaw up to a few hours ahead; it softens as it sits."}], "nutrition": "Per taco: 537 kcal, 20 g protein, 39 g carbs (3.9 g fiber), 34 g fat (18 g saturated), 573 mg sodium, 53 mg cholesterol.", "source": "Sunset magazine", "image": "img/baja-fried-fish-tacos.jpg", "added": "2026-10-17"}, {"id": "papa-murphys-style-calzone-dough", "title": "Papa Murphy's–Style Calzone Dough", "category": "Breads", "description": "A lean, chewy bread-flour dough rolled thin for single-serving calzones with a braided edge, like Papa Murphy's take-and-bake.", "servings": 4, "servingWord": "calzones", "yieldNote": "Makes 4 single-serving calzones", "activeTime": 35, "totalTime": 130, "equipment": ["Large mixing bowl", "Rolling pin", "Large baking sheet", "Parchment paper or cornmeal", "Pastry brush", "Sharp knife"], "groups": [{"name": "Dough", "items": [{"key": "water", "qty": 295, "unit": "ml", "name": "warm water", "short": "warm water", "us": {"qty": 1.25, "unit": "cup"}, "note": "about 43°C / 110°F"}, {"key": "yeast", "qty": 7, "unit": "g", "name": "active dry yeast", "short": "yeast", "us": {"qty": 2.25, "unit": "tsp"}, "note": "1 packet"}, {"key": "sugar", "qty": 15, "unit": "g", "name": "sugar", "short": "sugar", "us": {"qty": 1.25, "unit": "tbsp"}}, {"key": "flour", "qty": 415, "unit": "g", "name": "bread flour", "short": "bread flour", "us": {"qty": 3.25, "unit": "cup"}, "note": "plus extra for rolling"}, {"key": "salt", "qty": 3, "unit": "g", "name": "fine salt", "short": "salt", "us": {"qty": 0.5, "unit": "tsp"}}]}, {"name": "To finish", "items": [{"key": "oil", "qty": 15, "unit": "ml", "name": "olive oil", "short": "olive oil", "us": {"qty": 1, "unit": "tbsp"}, "note": "plus a little for the bowl"}, {"name": "Cornmeal, for the baking sheet (optional)"}, {"name": "Marinara sauce, warmed, for dipping"}]}, {"name": "Filling (pick a combo below)", "items": [{"name": "Low-moisture mozzarella, shredded"}, {"name": "Pepperoni, cooked sausage, cooked chicken or other fillings"}]}], "steps": [{"title": "Wake up the yeast", "text": "In a large bowl, stir together {water}, {yeast} and {sugar}. Leave for 8–10 minutes, until foamy on top.", "timer": 10}, {"title": "Mix the dough", "text": "Add {flour} and {salt} and stir until a shaggy dough forms and no dry flour is left."}, {"title": "Knead", "text": "Turn the dough out onto a lightly floured surface and knead for 8–10 minutes, until smooth, springy and no longer sticky. Add a sprinkle more flour only if it sticks to your hands.", "timer": 10}, {"title": "Let it rise", "text": "Put the dough in a lightly oiled bowl, turn to coat, cover and leave somewhere warm for about an hour, until doubled.", "timer": 60}, {"title": "Divide and rest", "text": "Heat the oven to 220°C / 200°C fan / gas 7 (425°F). Punch the dough down and divide it into 4 equal pieces (about 180 g each). Shape each into a ball, cover with a towel and rest for 10 minutes so it rolls out thin without shrinking back.", "timer": 10}, {"title": "Roll it thin", "text": "On a lightly floured surface, roll each ball into a round about 28–30 cm (11–12 in) across and 3 mm (⅛ in) thick. Thin is the point here: this is what keeps it from being a doughy folded pizza. If it springs back, cover it and give it 5 more minutes."}, {"title": "Fill", "text": "Spread a modest single layer of filling over one half of each round, leaving a 2.5 cm (1 in) border bare. Brush the border lightly with water."}, {"title": "Fold and braid the edge", "text": "Fold the bare half over the filling and press the edges together. Starting at one corner, fold a small section of the edge over onto itself and press down, then repeat all the way around to make a rope-like braided seal. Cut 2–3 small slits in the top so steam can escape."}, {"title": "Bake", "text": "Move the calzones to a baking sheet lined with parchment or dusted with cornmeal. Brush the tops with {oil}. Bake for 14–18 minutes, until deep golden brown all over. Rest for 5 minutes, then serve with warm marinara for dipping.", "timer": 16}], "variations": ["Pepperoni and mozzarella", "Garlic chicken: cooked diced chicken, a spoonful of creamy garlic sauce, mozzarella and a handful of spinach", "Italian sausage, sautéed mushrooms and onions, mozzarella", "Classic: ricotta, mozzarella, Parmesan and sliced ham"], "tips": ["Papa Murphy's doesn't publish its dough recipe. This is a widely shared copycat: a lean bread-flour dough with no oil, which is why it rolls thin and bakes crisp-chewy instead of bready.", "Use bread flour. All-purpose flour gives a softer, less chewy crust.", "The source uses only ½ tsp salt. For a more seasoned crust you can go up to 1 tsp.", "Keep fillings dry: use low-moisture mozza
