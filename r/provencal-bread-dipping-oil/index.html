rella, cook and drain meats, and sauté wet vegetables first. Serve the sauce on the side for dipping rather than inside, or the bottom goes soggy."], "makeAhead": [{"title": "Dough in the fridge", "text": "After kneading, put the dough in an oiled, covered container and refrigerate for up to 3 days. The slow rise improves the flavor. Let it sit at room temperature for 30–45 minutes before dividing."}, {"title": "Freeze the dough", "text": "Freeze the divided dough balls, wrapped well, for up to 3 months. Thaw overnight in the fridge."}, {"title": "Take-and-bake", "text": "Assemble the calzones but don't bake them. Freeze on a tray until firm, then wrap individually. Bake from frozen at the same temperature, adding 8–10 minutes."}], "source": "Copycat Papa Murphy's Pizza Dough, KeyIngredient.com (via Just A Pinch); thin calzone shaping and bake adapted", "image": "img/papa-murphys-style-calzone-dough.jpg", "added": "2026-10-19"}, {"id": "slow-cooked-short-rib-chilli", "title": "Slow-Cooked Short Rib Chilli", "category": "Mains", "description": "Bone-in short ribs braised low and slow in a smoky, rich, slightly sweet chilli sauce with ancho or chipotle, spices and a spoonful of peanut butter.", "servings": 6, "servingWord": "servings", "yieldNote": "Serves 6", "activeTime": 35, "totalTime": 195, "equipment": ["Large ovenproof casserole dish (Dutch oven) with a lid", "Large plate", "Ladle"], "groups": [{"name": "Ribs", "items": [{"key": "oil", "qty": 30, "unit": "ml", "name": "sunflower oil", "short": "sunflower oil", "us": {"qty": 2, "unit": "tbsp"}}, {"key": "ribs", "qty": 6, "name": "bone-in beef short ribs", "short": "short ribs", "note": "about 2 kg / 4½ lb in total"}, {"name": "Salt and pepper"}]}, {"name": "Spice base", "items": [{"key": "onions", "qty": 2, "name": "onions, finely chopped", "short": "onions"}, {"key": "cumin", "qty": 1, "unit": "tsp", "name": "cumin seeds", "short": "cumin seeds"}, {"key": "coriander", "qty": 1, "unit": "tsp", "name": "coriander seeds", "short": "coriander seeds"}, {"key": "paprika", "qty": 1, "unit": "tsp", "name": "smoked paprika", "short": "smoked paprika"}, {"key": "cinnamon", "qty": 1, "name": "small cinnamon stick", "short": "cinnamon stick"}, {"key": "oregano", "qty": 1, "unit": "tsp", "name": "dried oregano", "short": "oregano"}, {"key": "bay", "qty": 1, "name": "bay leaf", "short": "bay leaf"}, {"key": "garlic", "qty": 2, "name": "garlic cloves, grated", "short": "garlic"}, {"key": "chilli", "qty": 2, "unit": "tbsp", "name": "ancho or chipotle paste", "short": "ancho or chipotle paste"}, {"key": "tomatopaste", "qty": 2, "unit": "tbsp", "name": "tomato purée (tomato paste)", "short": "tomato purée"}, {"key": "peanut", "qty": 1, "unit": "tbsp", "name": "smooth peanut butter", "short": "peanut butter"}, {"key": "sugar", "qty": 1, "unit": "tbsp", "name": "dark brown sugar", "short": "dark brown sugar"}]}, {"name": "Sauce", "items": [{"key": "vinegar", "qty": 30, "unit": "ml", "name": "apple cider vinegar", "short": "cider vinegar", "us": {"qty": 2, "unit": "tbsp"}}, {"key": "tomatoes", "qty": 400, "unit": "g", "name": "tin chopped tomatoes", "short": "chopped tomatoes", "us": {"qty": 14, "unit": "oz"}, "note": "1 tin"}, {"key": "stock", "qty": 750, "unit": "ml", "name": "beef stock", "short": "beef stock", "us": {"qty": 3, "unit": "cup"}}]}], "steps": [{"title": "Heat the oven", "text": "Heat the oven to 160°C / 140°C fan / gas 3 (325°F)."}, {"title": "Brown the ribs", "text": "Heat {oil} in a large casserole dish over medium-high heat. Season {ribs} with salt and pepper and brown them in batches until well colored on all sides. Move to a plate."}, {"title": "Soften the onions", "text": "Turn the heat down a little and cook {onions} for 8–10 minutes, until soft and just catching on the bottom of the pan.", "timer": 10}, {"title": "Toast the spices", "text": "Stir in {cumin}, {coriander}, {paprika}, {cinnamon}, {oregano} and {bay} and toast for 1 minute.", "timer": 1}, {"title": "Cook the paste", "text": "Stir in {garlic}, {chilli}, {tomatopaste}, {peanut} and {sugar}. Cook, stirring, until everything is thick and starting to stick to the pan."}, {"title": "Deglaze and add the liquid", "text": "Pour in {vinegar} and scrape up the browned bits from the bottom. Stir in {tomatoes} and {stock} and bring to a gentle simmer."}, {"title": "Braise", "text": "Nestle the ribs back into the sauce, cover with the lid and cook in the oven for 2–3 hours, turning them once or twice, until the meat is falling off the bone.", "timer": 150}, {"title": "Remove the fat", "text": "Best option: cool and chill the whole pot (ideally overnight). The fat sets on top and lifts right off. If you're eating it now, ladle off as much fat from the surface as you can."}, {"title": "Reduce and season", "text": "Lift the ribs onto a plate and simmer the sauce for 10 minutes to reduce a little. Taste and adjust the seasoning. It should be smoky, rich and just a little sweet.", "timer": 10}, {"title": "Serve", "text": "For a dinner party, serve each person a whole short rib with plenty of sauce. Or pull the meat off the bones, discard the bones and stir the meat back through the sauce."}], "tips": ["Buy supermarket-size short ribs. The ones from butchers are often far too big for this.", "No short ribs? Large chunks of beef shin work just as well.", "Short ribs give off a lot of fat, which is why braising a day or two ahead and chilling is the best way to go. The flavor improves too."], "makeAhead": [{"title": "In the fridge", "text": "Make it up to 3 days ahead. It only gets better as it sits, and chilling lets you lift off the fat. Cool completely, then cover and refrigerate."}, {"title": "Freeze", "text": "Freeze for up to 3 months. Defrost fully, then reheat gently until piping hot."}], "source": "Magazine clipping, p. 61", "image": "img/slow-cooked-short-rib-chilli.jpg", "added": "2026-10-19"}, {"id": "provencal-bread-dipping-oil", "title": "Provençal Bread Dipping Oil", "category": "Snacks", "description": "A tapenade-style dish of olive oil with chopped black olives, dried figs, capers, lemon, garlic, parsley and a splash of raspberry vinegar, for dunking crusty bread.", "servings": 6, "servingWord": "servings", "yieldNote": "Serves 4–6", "activeTime": 5, "totalTime": 5, "equipment": ["Shallow bowl or lipped plate", "Fine grater (for the zest and garlic)"], "groups": [{"name": "Dipping oil", "items": [{"key": "oil", "qty": 200, "unit": "ml", "name": "extra-virgin olive oil", "short": "extra-virgin olive oil", "us": {"qty": 0.8, "unit": "cup"}, "note": "a scant 1 cup"}, {"key": "olives", "qty": 4, "unit": "tbsp", "name": "Provençal black olives, finely chopped", "short": "chopped black olives"}, {"key": "figs", "qty": 3, "name": "dried figs, chopped", "short": "chopped dried figs", "note": "2–3"}, {"key": "lemon", "qty": 1, "name": "lemon, zested", "short": "lemon zest", "note": "use the zest"}, {"key": "garlic", "qty": 1, "name": "garlic clove, grated", "short": "grated garlic"}, {"key": "parsley", "qty": 2, "unit": "tbsp", "name": "finely chopped parsley", "short": "chopped parsley"}, {"key": "capers", "qty": 2, "unit": "tsp", "name": "non-pareil capers", "short": "capers"}, {"key": "vinegar", "qty": 4, "unit": "tsp", "name": "raspberry vinegar", "short": "raspberry vinegar", "note": "or 3 tsp balsamic vinegar"}, {"name": "Sea salt flakes"}]}, {"name": "To serve", "items": [{"name": "Crusty bread"}]}], "steps": [{"title": "Mix", "text": "In a shallow bowl or lipped plate, combine {oil}, {olives}, {figs}, {lemon}, {garlic}, {parsley}, {capers} and {vinegar}. Season with a few sea salt flakes."}, {"title": "Serve", "text": "Serve with crusty bread for dunking."}], "tips": ["It comes together in minutes and improves as it sits, so make it a little before guests arrive.", "The figs add a gentle sweetness that balances the salty olives and capers, and the vinegar cuts through the richness of the oil.", "For a prettier plate, spoon each ingredient into its own little pile in the oil instead of stirring everything together."], "nutrition": "Per serving (6): 310 kcal, 32 g fat (5 g saturated), 5 g carbs, 4 g sugars, 2 g fiber, 0.4 g protein, 0.3 g salt.", "source": "Magazine clipping, pp. 32–33", "image": "img/provencal-bread-dipping-oil.jpg", "added": "2026-10-19"}, {"id": "creamy-lobster-linguine", "title": "Creamy Shrimp Linguine", "category": "Mains", "description": "Linguine in a silky cream sauce built on a quick stock infused with the shrimp shells, tarragon and fennel seed, finished with chives, parmesan and Aleppo pepper.", "servings": 2, "servingWord": "servings", "yieldNote": "Serves 2", "activeTime": 30, "totalTime": 65, "equipment": ["Kitchen scissors (optional, for peeling)", "2 saucepans", "Large pot for the pasta", "Fine sieve", "Measuring jug"], "groups": [{"name": "Shrimp and infused stock", "items": [{"key": "shrimp", "qty": 340, "unit": "g", "name": "large raw shrimp, shell on", "short": "shrimp", "us": {"qty": 0.75, "unit": "lb"}, "note": "shells are used for the stock"}, {"key": "stock", "qty": 300, "unit": "ml", "name": "light chicken stock", "short": "chicken stock", "us": {"qty": 1.25, "unit": "cup"}}, {"key": "garlic", "qty": 1, "name": "garlic clove, unpeeled", "short": "garlic clove"}, {"name": "Small bunch of tarragon, leaves picked and stalks kept"}, {"key": "fennel", "qty": 1, "unit": "tsp", "name": "fennel seeds", "short": "fennel seeds"}, {"key": "peppercorns", "qty": 1, "unit": "tsp", "name": "whole black peppercorns", "short": "black peppercorns"}, {"key": "shallot1", "qty": 1, "name": "shallot, halved", "short": "halved shallot"}]}, {"name": "Sauce and pasta", "items": [{"name": "Knob of butter", "note": "about 1 tbsp"}, {"key": "shallot2", "qty": 1, "name": "shallot, finely chopped", "short": "chopped shallot"}, {"key": "cream", "qty": 90, "unit": "ml", "name": "double cream (heavy cream)", "short": "cream", "us": {"qty": 6, "unit": "tbsp"}}, {"key": "linguine", "qty": 175, "unit": "g", "name": "linguine", "short": "linguine", "us": {"qty": 6, "unit": "oz"}}, {"key": "chives", "qty": 1, "unit": "tbsp", "name": "finely chopped chives", "short": "chopped chives", "note": "plus extra to serve"}, {"key": "parmesan", "qty": 25, "unit": "g", "name": "parmesan, finely grated", "short": "grated parmesan", "us": {"qty": 0.33, "unit": "cup"}}]}, {"name": "To serve", "items": [{"name": "Pinch of Aleppo pepper"}, {"name": "Lemon wedges"}]}], "steps": [{"title": "Peel the shrimp", "text": "Peel and devein {shrimp}, keeping the shells. Keep the shrimp chilled."}, {"title": "Infuse the stock", "text": "Put {stock} in a pan with {garlic}, the tarragon stalks, {fennel}, {peppercorns}, the shrimp shells and {shallot1}. Cover and simmer for 20 minutes, then take off the heat and leave to infuse. Meanwhile, chop 1 tbsp of the tarragon leaves.", "timer": 20}, {"title": "Soften the shallot", "text": "Melt the butter in a pan over medium-low heat and cook {shallot2} for 10 minutes, until softened.", "timer": 10}, {"title": "Reduce the sauce", "text": "Strain the infused stock, measure out 200 ml (about ¾ cup + 1 tbsp) and pour it into the shallot pan. Simmer for 5–10 minutes, until reduced by half. Add {cream} and simmer for 2 minutes more.", "timer": 8}, {"title": "Cook the linguine", "text": "Meanwhile, cook {linguine} according to the pack instructions. Drain, saving a cup of the cooking water.", "timer": 10}, {"title": "Bring it together", "text": "Add the shrimp to the sauce and simmer gently, stirring, until pink and just cooked through, 2–3 minutes. Add the linguine and toss, then add {chives}, the chopped tarragon and {parmesan} and toss again. Add a splash of cooking water if needed. The sauce should be loose and silky.", "timer": 3}, {"title": "Serve", "text": "Serve in warm bowls, topped with extra chives, a pinch of Aleppo pepper and lemon wedges on the side."}], "tips": ["Don't skip simmering the shells in the stock. That's where most of the shrimp flavor in the sauce comes from.", "Take the shrimp off the heat as soon as they turn pink. They get rubbery if overcooked.", "No Aleppo pepper? A small pinch of regular red pepper flakes works.", "The original recipe has you chop tarragon leaves but never says when to add them. Stirring them in with the chives works well."], "nutrition": "Per serving: 964 kcal, 61 g fat (36 g saturated), 58 g carbs, 7 g sugars, 6 g fiber, 42 g protein, 2 g salt.", "source": "Magazine clipping, pp. 8–9", "image": "img/creamy-lobster-linguine.jpg", "added": "2026-10-19"}, {"id": "sheet-pan-halloumi", "title": "Sheet-Pan Halloumi", "category": "Mains", "description": "A fattoush-style dinner salad of oven-crisped pita and golden halloumi tossed with citrus, shallot, jalapeño, dill and avocado in a lime-honey dressing.", "servings": 4, "servingWord": "servings", "yieldNote": "Serves 4", "activeTime": 25, "totalTime": 35, "equipment": ["Rimmed baking sheet", "Large bowl", "Small sharp knife", "2 large spoons for tossing", "Platter"], "groups": [{"name": "Pita and cheese", "items": [{"key": "pita", "qty": 4, "name": "medium pitas (about 8 oz / 225 g total), torn into 1½-inch (4 cm) pieces", "short": "torn pita", "note": "3–4"}, {"key": "halloumi", "qty": 2, "name": "8–10 oz (225–280 g) packs halloumi, patted dry and torn into 1½-inch (4 cm) pieces", "short": "packs torn halloumi"}, {"key": "oil1", "qty": 60, "unit": "ml", "name": "extra-virgin olive oil", "short": "olive oil", "us": {"qty": 0.25, "unit": "cup"}}, {"name": "Kosher salt", "note": "a big pinch"}]}, {"name": "Dressing", "items": [{"key": "lime", "qty": 60, "unit": "ml", "name": "fresh lime juice", "short": "lime juice", "us": {"qty": 0.25, "unit": "cup"}}, {"key": "honey", "qty": 2, "unit": "tbsp", "name": "honey", "short": "honey"}, {"key": "salt", "qty": 1, "unit": "tsp", "name": "Diamond Crystal kosher salt", "short": "kosher salt", "note": "or ½ tsp Morton; plus more"}, {"key": "oil2", "qty": 60, "unit": "ml", "name": "extra-virgin olive oil", "short": "olive oil", "us": {"qty": 0.25, "unit": "cup"}}]}, {"name": "Salad", "items": [{"key": "oranges", "qty": 2, "name": "medium oranges, preferably blood oranges", "short": "oranges"}, {"key": "grapefruit", "qty": 1, "name": "large grapefruit", "short": "grapefruit"}, {"key": "shallot", "qty": 1, "name": "medium shallot, thinly sliced", "short": "sliced shallot"}, {"key": "jalapeno", "qty": 1, "name": "medium jalapeño, thinly sliced, divided", "short": "sliced jalapeño"}, {"key": "dill", "qty": 15, "unit": "g", "name": "coarsely chopped dill", "short": "chopped dill", "us": {"qty": 0.67, "unit": "cup"}}, {"key": "avocado", "qty": 1, "name": "large ripe avocado, halved and pitted", "short": "avocado"}]}], "steps": [{"title": "Heat the oven and pan", "text": "Set a rack in the middle of the oven and put a rimmed baking sheet on it. Heat the oven to 200°C / 180°C fan / gas 6 (400°F)."}, {"title": "Oil the pita and cheese", "text": "In a large bowl, toss {pita} and {halloumi} with {oil1} and a big pinch of salt until well coated. Carefully spread in a single layer on the hot baking sheet. Keep the bowl."}, {"title": "Roast", "text": "Roast, tossing halfway through, until the pita is crisp and the cheese is golden brown on a few sides, 18–20 minutes.", "timer": 20}, {"title": "Make the dressing", "text": "Meanwhile, whisk {lime}, {honey}, {salt} and {oil2} together in the reserved bowl."}, {"title": "Prep the citrus", "text": "Working one at a time, cut the peel and white pith off {oranges} and {grapefruit} with a small sharp knife. Halve each one, then cut into ½-inch (1 cm) wedges, thin slices, or a mix of both."}, {"title": "Toss the salad", "text": "Add the citrus to the dressing, then {shallot} and half of {jalapeno}. Add the roasted pita and cheese and toss gently with two large spoons."}, {"title": "Finish and serve", "text": "Move the salad to a platter and scatter {dill} and the rest of the jalapeño over the top. Scoop curls of {avocado} out with a spoon and tuck them over the salad. Drizzle with any dressing left in the bowl."}], "variations": ["Add a can of drained chickpeas or some flaked smoked fish to stretch it for more people."], "tips": ["Pat the halloumi dry before tearing so it browns instead of steaming.", "The pita croutons soak up the dressing and go from crisp to pleasantly soggy, the same way fattoush does. Serve soon after tossing.", "Some halloumi pieces end up crisp outside and gooey in the middle. Those are the best bites."], "source": "Bon Appétit, December 2025/January 2026, p. 50 (Emma Laperruque)", "image": "img/sheet-pan-halloumi.jpg", "added": "2026-10-21"}, {"id": "shrimp-scampi-bisque", "title": "Shrimp Scampi Bisque", "category": "Soups", "description": "A silky, garlicky bisque that gets its deep seafood flavor from blending shrimp shells into the soup, topped with buttery lemon-garlic scampi shrimp.", "servings": 10, "servingWord": "servings", "yieldNote": "Serves 8–12", "activeTime": 60, "totalTime": 90, "equipment": ["Medium Dutch oven or other heavy pot", "Blender", "Fine-mesh sieve and cheesecloth (or a chinois)", "Vegetable peeler", "Medium skillet"], "groups": [{"name": "Bisque", "items": [{"key": "oil1", "qty": 60, "unit": "ml", "name": "extra-virgin olive oil", "short": "olive oil", "us": {"qty": 0.25, "unit": "cup"}}, {"key": "shrimp", "qty": 900, "unit": "g", "name": "large shrimp, peeled, deveined and cut into ½-inch (1 cm) pieces", "short": "chopped shrimp", "us": {"qty": 2, "unit": "lb"}, "note": "keep the shells for the bisque"}, {"key": "onions", "qty": 3, "name": "medium onions, finely chopped", "short": "chopped onions"}, {"key": "potato", "qty": 1, "name": "large russet potato (about 14 oz / 400 g), peeled and cut into 1-inch (2.5 cm) pieces", "short": "diced potato"}, {"key": "celery", "qty": 3, "name": "celery stalks, chopped", "short": "chopped celery stalks"}, {"key": "carrots", "qty": 2, "name": "medium carrots, peeled and chopped", "short": "chopped carrots"}, {"key": "garlic1", "qty": 10, "name": "garlic cloves, smashed", "short": "smashed garlic cloves"}, {"key": "bay", "qty": 2, "name": "bay leaves", "short": "bay leaves"}, {"key": "paste", "qty": 80, "unit": "ml", "name": "double-concentrated tomato paste", "short": "tomato paste", "us": {"qty": 0.33, "unit": "cup"}}, {"key": "wine", "qty": 240, "unit": "ml", "name": "dry white wine", "short": "white wine", "us": {"qty": 1, "unit": "cup"}}, {"key": "cognac", "qty": 120, "unit": "ml", "name": "cognac", "short": "cognac", "us": {"qty": 0.5, "unit": "cup"}}, {"key": "broth", "qty": 1900, "unit": "ml", "name": "low-sodium vegetable broth", "short": "vegetable broth", "us": {"qty": 8, "unit": "cup"}}, {"key": "cream", "qty": 120, "unit": "ml", "name": "heavy cream", "short": "heavy cream", "us": {"qty": 0.5, "unit": "cup"}}, {"key": "salt", "qty": 1.5, "unit": "tsp", "name": "Diamond Crystal kosher salt", "short": "kosher salt", "note": "or 1 tsp Morton; plus more"}, {"name": "Freshly ground pepper"}]}, {"name": "Scampi topping", "items": [{"key": "lemon", "qty": 1, "name": "lemon", "short": "lemon"}, {"key": "oil2", "qty": 60, "unit": "ml", "name": "extra-virgin olive oil", "short": "olive oil", "us": {"qty": 0.25, "unit": "cup"}}, {"key": "garlic2", "qty": 6, "name": "garlic cloves, thinly sliced", "short": "sliced garlic cloves"}, {"key": "butter", "qty": 2, "unit": "tbsp", "name": "unsalted butter", "short": "butter"}, {"key": "parsley", "qty": 15, "unit": "g", "name": "finely chopped parsley", "short": "chopped parsley", "us": {"qty": 0.25, "unit": "cup"}}]}], "steps": [{"title": "Brown the shells", "text": "Heat {oil1} in a medium Dutch oven or other heavy pot over medium heat. Add the reserved shrimp shells and cook, stirring often, until pink and browned in spots, 6–8 minutes. Keep the shrimp meat chilled for the topping.", "timer": 8}, {"title": "Cook the vegetables", "text": "Add {onions}, {potato}, {celery}, {carrots}, {garlic1} and {bay}. Cook, stirring often, until the vegetables soften and the onion browns in spots, 8–10 minutes.", "timer": 10}, {"title": "Toast the tomato paste", "text": "Stir in {paste} and cook, stirring often, until it darkens slightly, about 5 minutes.", "timer": 5}, {"title": "Reduce the wine and cognac", "text": "Pour in {wine} and {cognac} and bring to a boil. Cook, stirring often, until reduced by about two-thirds, about 4 minutes.", "timer": 4}, {"title": "Simmer", "text": "Add {broth} and bring to a boil. Lower the heat to medium and simmer for 20 minutes.", "timer": 20}, {"title": "Blend and strain", "text": "Fish out the bay leaves. Working in batches, blend the soup on medium-high until very smooth. Pour it through a fine-mesh sieve lined with cheesecloth back into the pot (or use a chinois and skip the cloth) and discard the solids. Stir in {cream} and {salt}, taste, and add more salt if needed. Keep warm over low heat."}, {"title": "Prep the lemon", "text": "Peel the zest from {lemon} in wide strips with a vegetable peeler, leaving as much white pith behind as you can, then slice the strips thinly. Halve the lemon and squeeze the juice into a small bowl."}, {"title": "Cook the shrimp", "text": "Heat {oil2} in a medium skillet over medium-high. Cook the lemon zest and {garlic2}, stirring often, until softened and fragrant, 2–3 minutes. Add {shrimp} and cook, stirring often, until just cooked through, 1–2 minutes.", "timer": 4}, {"title": "Finish the scampi", "text": "Add {butter} and the lemon juice and cook, stirring often, until the sauce turns glossy and thickens slightly, 1–2 minutes. Take off the heat, stir in {parsley} and season with salt and pepper.", "timer": 2}, {"title": "Serve", "text": "Ladle the bisque into bowls and spoon the shrimp mixture on top."}], "tips": ["The shells are where the flavor is. Blending them into the soup is the same trick classic lobster bisque uses, at a fraction of the cost.", "Don't skip straining. It catches any bits of shell so the bisque comes out completely smooth and creamy.", "Double-concentrated tomato paste gives a deeper, richer color and flavor than the canned kind.", "The original recipe blends the soup without mentioning the bay leaves. Pull them out first."], "makeAhead": [{"title": "Make the soup a day ahead", "text": "The bisque (without the shrimp topping) keeps covered in the fridge for 1 day. Rewarm gently over low heat and cook the scampi topping just before serving."}], "source": "Bon Appétit, December 2025/January 2026, p. 48 (Jesse Szewczyk)", "image": "img/shrimp-scampi-bisque.jpg", "added": "2026-10-21"}, {"id": "shrimp-stir-fry-garlic-chives", "title": "Shrimp Stir-Fry with Garlic Chives and Chiles", "category": "Mains", "description": "Crisp, golden shrimp and jalapeño slices stir-fried with a whole bunch of garlic chives and ginger, finished with mirin, soy and sesame oil.", "servings": 4, "servingWord": "servings", "yieldNote": "Serves 4", "activeTime": 20, "totalTime": 30, "equipment": ["Large plate", "Paper towels", "Large skillet", "Tongs", "Kitchen gloves (optional)"], "groups": [{"name": "Shrimp", "items": [{"key": "shrimp", "qty": 450, "unit": "g", "name": "large shrimp, peeled and deveined, tails left on", "short": "shrimp", "us": {"qty": 1, "unit": "lb"}}, {"key": "salt", "qty": 0.25, "unit": "tsp", "name": "kosher salt (Diamond Crystal or Morton)", "short": "kosher salt"}, {"name": "Freshly ground pepper"}, {"key": "jalapeno", "qty": 2, "name": "jalapeños, thinly sliced", "short": "sliced jalapeños", "note": "1–2"}, {"key": "cornstarch", "qty": 2, "unit": "tbsp", "name": "cornstarch", "short": "cornstarch"}, {"key": "oil", "qty": 60, "unit": "ml", "name": "vegetable oil", "short": "vegetable oil", "us": {"qty": 0.25, "unit": "cup"}, "note": "or a little more"}]}, {"name": "To finish", "items": [{"key": "chives", "qty": 1, "name": "bunch garlic chives (6–8 oz / 170–225 g), cut into 2-inch (5 cm) pieces", "short": "bunch garlic chives"}, {"key": "ginger", "qty": 1, "name": "2-inch (5 cm) piece ginger, peeled and cut into matchsticks", "short": "piece ginger, in matchsticks"}, {"key": "mirin", "qty": 1, "unit": "tbsp", "name": "mirin", "short": "mirin"}, {"key": "soy", "qty": 2, "unit": "tsp", "name": "soy sauce", "short": "soy sauce"}, {"key": "sesame", "qty": 0.25, "unit": "tsp", "name": "toasted sesame oil", "short": "toasted sesame oil"}, {"name": "Steamed rice, for serving (optional)"}]}], "steps": [{"title": "Salt the shrimp", "text": "Spread {shrimp} out on a large plate, sprinkle with {salt} and toss to coat. Spread back into a single layer and leave for 10 minutes.", "timer": 10}, {"title": "Coat", "text": "Blot the shrimp dry with paper towels and season with pepper. Scatter {jalapeno} over the shrimp, then sprinkle {cornstarch} evenly over everything. Toss gently with your hands (gloves are a good idea) until coated."}, {"title": "Sear the shrimp", "text": "Heat {oil} in a large skillet over high, then turn down to medium-high. With tongs, lay the shrimp in the pan in a single layer, adding a little more oil if needed. Some chile slices will stick to the shrimp, which is fine; add the rest to the pan. Cook, turning halfway and adjusting the heat as needed, until golden brown, about 4 minutes.", "timer": 4}, {"title": "Wilt the chives", "text": "Turn the heat to high, add {chives} and {ginger} and toss until the chives just wilt and the ginger smells fragrant, 30–60 seconds. Add {mirin} and {soy} and toss to combine.", "timer": 1}, {"title": "Serve", "text": "Take off the heat and stir in {sesame}. Pile onto a platter and serve with steamed rice, if you like."}], "variations": ["No garlic chives? Use scallions. Cut them into 2-inch (5 cm) pieces, halve the white parts lengthwise, and give them an extra 30–60 seconds in the pan."], "tips": ["Garlic chives (also called Chinese leeks) have flat leaves and taste like a gentler garlic. They work as both the aromatic and the green.", "Bunches are usually 6–12 oz. Use the whole thing; it cooks down to almost nothing in a stir-fry.", "Garlic chives keep about as long as scallions in the fridge.", "The whole dish is done in less time than a pot of rice, so start the rice first."], "source": "Magazine clipping, p. 97 (Hana Asbrink)", "image": "img/shrimp-stir-fry-garlic-chives.jpg", "added": "2026-10-21"}, {"id": "one-pan-herbed-chicken-and-biscuits", "title": "One-Pan Herbed Chicken and Biscuits", "category": "Mains", "description": "A lighter chicken and biscuits: ground chicken and vegetables in a lemon-mustard cream gravy, baked under scone-like wedges of dill and sour cream biscuit.", "servings": 4, "servingWord": "servings", "yieldNote": "Serves 4", "activeTime": 45, "totalTime": 115, "equipment": ["Large high-sided ovenproof skillet, rondeau or medium Dutch oven", "Wooden spoon", "Large bowl", "Baking sheet", "Pastry brush"], "groups": [{"name": "Gravy", "items": [{"key": "oil", "qty": 60, "unit": "ml", "name": "extra-virgin olive oil", "short": "olive oil", "us": {"qty": 0.25, "unit": "cup"}}, {"key": "chicken", "qty": 450, "unit": "g", "name": "ground chicken", "short": "ground chicken", "us": {"qty": 1, "unit": "lb"}}, {"key": "onions", "qty": 2, "name": "medium onions, thinly sliced", "short": "sliced onions"}, {"key": "celery", "qty": 4, "name": "celery stalks, cut on the diagonal 1 inch (2.5 cm) thick", "short": "sliced celery stalks"}, {"key": "carrots", "qty": 2, "name": "medium carrots, peeled, halved lengthwise and cut on the diagonal 1 inch (2.5 cm) thick", "short": "sliced carrots"}, {"key": "garlic", "qty": 6, "name": "garlic cloves, finely grated", "short": "grated garlic cloves"}, {"key": "flour1", "qty": 31, "unit": "g", "name": "all-purpose flour", "short": "flour", "us": {"qty": 0.25, "unit": "cup"}}, {"key": "broth", "qty": 480, "unit": "ml", "name": "low-sodium vegetable broth", "short": "vegetable broth", "us": {"qty": 2, "unit": "cup"}}, {"key": "wine", "qty": 120, "unit": "ml", "name": "dry white wine", "short": "white wine", "us": {"qty": 0.5, "unit": "cup"}}, {"key": "cream", "qty": 160, "unit": "ml", "name": "heavy cream", "short": "heavy cream", "us": {"qty": 0.67, "unit": "cup"}}, {"key": "mustard", "qty": 1.5, "unit": "tbsp", "name": "Dijon mustard", "short": "Dijon mustard"}, {"key": "zest", "qty": 1, "unit": "tbsp", "name": "finely grated lemon zest", "short": "lemon zest"}, {"key": "salt1", "qty": 1.5, "unit": "tsp", "name": "Diamond Crystal kosher salt", "short": "kosher salt", "note": "or ¾ tsp Morton; plus more"}, {"key": "pepper", "qty": 0.75, "unit": "tsp", "name": "freshly ground pepper", "short": "pepper", "note": "plus more"}]}, {"name": "Biscuits", "items": [{"key": "powder", "qty": 2, "unit": "tsp", "name": "baking powder", "short": "baking powder"}, {"key": "salt2", "qty": 1.5, "unit": "tsp", "name": "Diamond Crystal kosher salt", "short": "kosher salt", "note": "or ¾ tsp Morton"}, {"key": "soda", "qty": 0.5, "unit": "tsp", "name": "baking soda", "short": "baking soda"}, {"key": "flour2", "qty": 250, "unit": "g", "name": "all-purpose flour", "short": "flour", "us": {"qty": 2, "unit": "cup"}, "note": "plus more for the counter"}, {"key": "butter", "qty": 113, "unit": "g", "name": "chilled unsalted butter, cut into pieces", "short": "chilled butter", "us": {"qty": 1, "unit": "stick"}}, {"key": "sourcream", "qty": 300, "unit": "g", "name": "sour cream", "short": "sour cream", "us": {"qty": 1.25, "unit": "cup"}}, {"key": "dill", "qty": 18, "unit": "g", "name": "finely chopped dill", "short": "chopped dill", "us": {"qty": 0.75, "unit": "cup"}, "note": "plus more to serve"}, {"name": "Heavy cream, for brushing"}]}], "steps": [{"title": "Heat the oven", "text": "Set a rack in the middle of the oven and heat to 190°C / 170°C fan / gas 5 (375°F)."}, {"title": "Brown the chicken", "text": "Heat {oil} in a large high-sided ovenproof skillet, rondeau or medium Dutch oven over medium-high. Add {chicken}, press into an even layer, then break into marble-size pieces with a wooden spoon. Cook, mostly undisturbed, until deeply browned underneath, 6–9 minutes.", "timer": 8}, {"title": "Cook the vegetables", "text": "Add {onions}, {celery} and {carrots} and cook, stirring often, until the onions are tender and the carrots and celery are just starting to soften, 10–14 minutes.", "timer": 12}, {"title": "Add the flour", "text": "Stir in {garlic} and {flour1} until the chicken and vegetables are coated and no dry flour is left."}, {"title": "Make the gravy", "text": "Stirring constantly, slowly pour in {broth} and {wine}, then stir in {cream}, {mustard}, {zest}, {salt1} and {pepper}. Bring to a simmer and cook until the gravy coats a spoon, about 2 minutes. A little loose is fine; it thickens more in the oven. Take off the heat, taste for salt and pepper, and let cool slightly.", "timer": 2}, {"title": "Make the biscuit dough", "text": "While the gravy cools, whisk {powder}, {salt2}, {soda} and {flour2} in a large bowl. Rub {butter} into the flour with your fingertips until it completely disappears. Add {sourcream} and {dill} and mix just until a shaggy dough forms."}, {"title": "Shape the biscuits", "text": "Turn the dough onto a lightly floured surface and knead a few times, just until it holds together. It will still look shaggy. Pat into a 7-inch (18 cm) disk and cut into 8 wedges."}, {"title": "Bake", "text": "Arrange the wedges over the gravy, evenly spaced, and brush the tops with cream. Set the pan on a baking sheet and bake until the biscuits are deeply browned and the gravy bubbles around the edges, 55–65 minutes.", "timer": 60}, {"title": "Serve", "text": "Scatter more dill over the top and serve."}], "tips": ["Go easy mixing and kneading the biscuit dough. Shaggy edges are fine, and the payoff is a very tender crumb.", "The baking sheet underneath catches any gravy that bubbles over.", "Patting the dough into one disk and cutting wedges, instead of dolloping, gives neat portions that are easy to serve."], "source": "Magazine clipping, p. 82 (Jesse Szewczyk)", "image": "img/one-pan-herbed-chicken-and-biscuits.jpg", "added": "2026-10-21"}, {"id": "broken-lasagna-noodle-soup", "title": "Broken Lasagna Noodle Soup", "category": "Soups", "description": "All the flavor of lasagna in a weeknight soup: Italian sausage and deeply toasted tomato paste, broken noodles cooked right in the pot, arugula and a dollop of ricotta.", "servings": 4, "servingWord": "servings", "yieldNote": "Serves 4", "activeTime": 30, "totalTime": 40, "equipment": ["Medium Dutch oven or other heavy pot", "Wooden spoon or heatproof spatula", "Slotted spoon", "Small bowl"], "groups": [{"name": "Soup", "items": [{"key": "oil", "qty": 2, "unit": "tbsp", "name": "extra-virgin olive oil", "short": "olive oil"}, {"key": "sausage", "qty": 450, "unit": "g", "name": "hot or sweet Italian sausage, casings removed", "short": "Italian sausage", "us": {"qty": 1, "unit": "lb"}}, {"key": "onion", "qty": 1, "name": "medium onion, chopped", "short": "chopped onion"}, {"key": "salt", "qty": 1, "unit": "tsp", "name": "Diamond Crystal kosher salt", "short": "kosher salt", "note": "or ½ tsp Morton; plus more"}, {"key": "garlic", "qty": 5, "name": "garlic cloves, thinly sliced", "short": "sliced garlic cloves"}, {"key": "paste", "qty": 1, "name": "4.5-oz (128 g) tube double-concentrated tomato paste (about ½ cup)", "short": "tube tomato paste"}, {"key": "broth", "qty": 950, "unit": "ml", "name": "low-sodium chicken broth", "short": "chicken broth", "us": {"qty": 4, "unit": "cup"}}, {"key": "noodles", "qty": 285, "unit": "g", "name": "dried lasagna noodles (about 10), broken into 2–3-inch (5–7.5 cm) pieces", "short": "broken lasagna noodles", "us": {"qty": 10, "unit": "oz"}}, {"key": "spinach", "qty": 140, "unit": "g", "name": "baby arugula", "short": "baby arugula", "us": {"qty": 5, "unit": "oz"}}, {"name": "Water", "note": "4 cups (950 ml), added in two batches"}]}, {"name": "To serve", "items": [{"key": "ricotta", "qty": 240, "unit": "g", "name": "whole-milk ricotta", "short": "ricotta", "us": {"qty": 1, "unit": "cup"}}, {"name": "Freshly ground pepper"}]}], "steps": [{"title": "Brown the sausage", "text": "Heat {oil} in a medium Dutch oven or other heavy pot over medium-high. Pinch {sausage} into roughly 1-inch (2.5 cm) pieces and lay them in the pot in a single layer. Cook undisturbed for 3 minutes, then stir occasionally with a wooden spoon or spatula until browned all over and just cooked through, 3–4 minutes more. Lift out with a slotted spoon onto a plate.", "timer": 7}, {"title": "Cook the onion and tomato paste", "text": "Add {onion} to the pot, season with a little salt and cook, stirring often, until slightly softened and starting to brown, about 3 minutes. Add {garlic} and {paste} and cook, stirring often, until the paste starts sticking to the pot and turns much darker, about 3 minutes.", "timer": 6}, {"title": "Deglaze", "text": "Pour in 2 cups (480 ml) water and scrape up any browned bits stuck to the bottom."}, {"title": "Cook the noodles", "text": "Add {broth} and {salt}. Turn the heat to high and bring to a boil. Add {noodles} and cook, stirring often, until very al dente, about 9 minutes.", "timer": 9}, {"title": "Season the ricotta", "text": "Meanwhile, put {ricotta} in a small bowl, season with salt and pepper and mix well."}, {"title": "Finish the soup", "text": "Stir another 2 cups (480 ml) water into the soup, which will have thickened by now. Return the sausage, turn the heat to low and cook until warmed through, about 5 minutes. Take off the heat, stir in {spinach} and season with more salt and pepper if needed.", "timer": 5}, {"title": "Serve", "text": "Ladle into bowls, top each with a dollop of the ricotta and finish with more pepper."}], "tips": ["Cooking the noodles right in the pot releases just enough starch to give the broth some body.", "Double-concentrated tomato paste is worth buying. Frying it until it darkens a few shades deepens its fruity, savory flavor and gives the broth a velvety texture.", "Hot sausage makes it spicy; sweet sausage keeps it mild."], "source": "Magazine clipping, Spring 2026, p. 14 (Rebecca Firkser)", "image": "img/broken-lasagna-noodle-soup.jpg", "added": "2026-10-21"}, {"id": "paella-de-pollo-con-verduras", "title": "Paella de Pollo con Verduras", "category": "Mains", "description": "A smoky stovetop chicken and vegetable paella with saffron, rosemary and a crunchy socarrat crust, made in a paella pan or large skillet.", "servings": 5, "servingWord": "servings", "yieldNote": "Serves 4–6", "activeTime": 50, "totalTime": 60, "equipment": ["15-inch (38 cm) paella pan or two-handled cast-iron or cast-aluminum skillet", "Sharp knife", "Cutting board", "Wooden spoon"], "groups": [{"name": "Chicken", "items": [{"key": "chicken", "qty": 450, "unit": "g", "name": "skin-on, bone-in chicken thighs (about 3), or wings with drumettes and flats separated (8–10)", "short": "chicken", "us": {"qty": 1, "unit": "lb"}}, {"key": "oil", "qty": 2, "unit": "tbsp", "name": "extra-virgin olive oil", "short": "olive oil"}, {"name": "Kosher salt", "note": "a big pinch for the chicken"}]}, {"name": "Vegetables", "items": [{"key": "mushrooms", "qty": 55, "unit": "g", "name": "mushrooms, preferably chanterelles, cut into ½-inch (1 cm) pieces (about ½ cup)", "short": "mushrooms", "us": {"qty": 2, "unit": "oz"}}, {"key": "carrots", "qty": 85, "unit": "g", "name": "carrots (1–2 small), peeled, trimmed and cut into ½-inch (1 cm) pieces (about ½ cup)", "short": "carrots", "us": {"qty": 3, "unit": "oz"}}, {"key": "squash", "qty": 85, "unit": "g", "name": "pattypan squash or zucchini, trimmed and cut into ½-inch (1 cm) pieces (about 1 cup)", "short": "squash", "us": {"qty": 3, "unit": "oz"}}, {"key": "cauliflower", "qty": 50, "unit": "g", "name": "small cauliflower florets", "short": "cauliflower florets", "us": {"qty": 0.5, "unit": "cup"}}, {"key": "asparagus", "qty": 55, "unit": "g", "name": "asparagus, trimmed and cut into 1½-inch (4 cm) pieces (about ½ cup)", "short": "asparagus", "us": {"qty": 2, "unit": "oz"}}, {"key": "beans", "qty": 55, "unit": "g", "name": "Romano or other snap beans, trimmed and cut into 1½-inch (4 cm) pieces (about ½ cup)", "short": "beans", "us": {"qty": 2, "unit": "oz"}}]}, {"name": "Sofrito, broth and rice", "items": [{"key": "paprika", "qty": 1, "unit": "tsp", "name": "smoked Spanish paprika", "short": "smoked paprika"}, {"key": "tomato", "qty": 120, "unit": "ml", "name": "coarsely grated fresh tomato or canned crushed tomatoes", "short": "grated tomato", "us": {"qty": 0.5, "unit": "cup"}}, {"name": "Pinch of saffron (about 8 threads)"}, {"key": "rosemary", "qty": 2, "name": "rosemary sprigs", "short": "rosemary sprigs"}, {"key": "broth", "qty": 1200, "unit": "ml", "name": "low-sodium chicken broth or water", "short": "chicken broth", "us": {"qty": 5, "unit": "cup"}}, {"key": "salt", "qty": 1, "unit": "tsp", "name": "Diamond Crystal kosher salt", "short": "kosher salt", "note": "or ½ tsp Morton; plus more"}, {"key": "rice", "qty": 200, "unit": "g", "name": "paella or bomba rice", "short": "paella rice", "us": {"qty": 1, "unit": "cup"}}]}], "steps": [{"title": "Bone the thighs", "text": "If using thighs, lay one skin-side down on a cutting board. With a sharp knife, cut along both sides of the bone to free it from the meat, without cutting all the way through, so the thigh stays in one piece. Slide the knife under the bone, cut the meat away and discard the bone. Cut the thigh into quarters. Repeat with the rest. Wings go in as they are."}, {"title": "Brown the chicken", "text": "Heat {oil} in a 15-inch (38 cm) paella pan or two-handled skillet over medium-high until it just starts to smoke, 1–2 minutes. Add {chicken} and cook, turning about every 3 minutes and moving the pan around the burner every couple of minutes so it cooks evenly, until deeply browned all over, 7–9 minutes. Season with a big pinch of salt and push to the edges of the pan.", "timer": 9}, {"title": "Brown the vegetables", "text": "Add {mushrooms} to the center and cook, stirring, until just turning golden, about 1 minute. Add {carrots}, {squash} and {cauliflower} and cook, stirring occasionally, until lightly browned in spots, about 2 minutes. Add {asparagus} and {beans} and cook the same way, about 2 minutes more. Push the vegetables to the edges with the chicken.", "timer": 5}, {"title": "Make the sofrito", "text": "Add {paprika} to the center and stir constantly for 15 seconds to toast. Add {tomato} and cook, stirring occasionally, until thickened, about 2 minutes. Stir the chicken and vegetables into the tomato and cook until the sauce is slightly thick and caramelized, about 3 minutes.", "timer": 5}, {"title": "Add saffron and broth", "text": "Crumble the saffron into the sauce and stir. Add {rosemary}, {broth} and {salt}. Turn the heat to high and bring to a boil, moving the pan around the burner once or twice. Cook until the liquid has reduced by about a quarter, about 5 minutes.", "timer": 5}, {"title": "Add the rice", "text": "Remove and discard the rosemary. Scatter {rice} evenly around the pan and stir it in among the chicken and vegetables. Cook, stirring often with a wooden spoon and moving the pan around every couple of minutes, until the rice starts to swell as it absorbs the liquid, 7–9 minutes.", "timer": 8}, {"title": "Let it cook undisturbed", "text": "Turn the heat to medium-low and stir once to spread the rice, chicken and vegetables evenly across the pan. From here, don't stir. Cook, moving the pan around the burner every couple of minutes, until the rice is just al dente and the liquid is almost gone, about 5 minutes.", "timer": 5}, {"title": "Make the socarrat", "text": "Turn the heat to high and cook until a crunchy, caramelized crust (the socarrat) forms on the bottom. Listen for crackling and a toasty smell. Let the paella rest for 3 minutes before serving.", "timer": 3}], "tips": ["A home burner, gas or electric, can't heat a 15-inch pan evenly, so keep moving the pan around over the heat the whole time.", "Once the rice is spread out, leave it alone. Stirring at that point stops the socarrat from forming.", "No paella pan? A large two-handled cast-iron or cast-aluminum skillet works."], "source": "Magazine clipping, p. 88 (chef José Andrés)", "image": "img/paella-de-pollo-con-verduras.jpg", "added": "2026-10-21"}, {"id": "creole-sausage-roll-ups", "title": "Creole Sausage Roll-Ups", "category": "Snacks", "description": "Pigs in a blanket made with smoky andouille in puff pastry, sliced into bites and served with a spicy Creole hot honey mustard.", "servings": 5, "servingWord": "servings", "yieldNote": "Serves 4–6", "activeTime": 30, "totalTime": 140, "equipment": ["Parchment-lined baking sheet", "Small bowl", "Pastry brush", "Medium bowl", "Sharp knife"], "groups": [{"name": "Roll-ups", "items": [{"key": "pastry", "qty": 1, "name": "17.3-oz (490 g) package frozen puff pastry (2 sheets), thawed", "short": "package puff pastry"}, {"name": "All-purpose flour, for the counter"}, {"key": "sausages", "qty": 4, "name": "6-inch (15 cm) andouille sausages (12 oz / 340 g total)", "short": "andouille sausages"}, {"key": "milk", "qty": 1, "unit": "tbsp", "name": "whole milk", "short": "milk"}, {"key": "egg1", "qty": 1, "name": "large egg, for sealing", "short": "egg"}, {"key": "egg2", "qty": 1, "name": "large egg, for brushing", "short": "egg"}, {"name": "Flaky sea salt"}]}, {"name": "Hot honey mustard", "items": [{"key": "mustard", "qty": 90, "unit": "ml", "name": "Creole or Dijon mustard", "short": "mustard", "us": {"qty": 6, "unit": "tbsp"}, "note": "¼ cup + 2 tbsp"}, {"key": "mayo", "qty": 90, "unit": "ml", "name": "mayonnaise", "short": "mayonnaise", "us": {"qty": 6, "unit": "tbsp"}, "note": "¼ cup + 2 tbsp"}, {"key": "honey", "qty": 3, "unit": "tbsp", "name": "honey", "short": "honey"}, {"key": "lemon", "qty": 2, "unit": "tbsp", "name": "fresh lemon juice", "short": "lemon juice"}, {"key": "cayenne", "qty": 1, "unit": "tsp", "name": "cayenne pepper", "short": "cayenne"}, {"key": "pepper", "qty": 1, "unit": "tsp", "name": "freshly ground black pepper", "short": "black pepper"}, {"key": "garlic", "qty": 1, "unit": "tsp", "name": "granulated garlic or garlic powder", "short": "granulated garlic"}, {"key": "onion", "qty": 1, "unit": "tsp", "name": "granulated onion or onion powder", "short": "granulated onion"}, {"key": "paprika", "qty": 0.5, "unit": "tsp", "name": "Hungarian paprika", "short": "paprika"}, {"key": "salt", "qty": 0.5, "unit": "tsp", "name": "Diamond Crystal kosher salt", "short": "kosher salt", "note": "or ¼ tsp Morton; plus more"}]}], "steps": [{"title": "Cut the pastry", "text": "On a lightly floured surface, cut each sheet from {pastry} in half lengthwise, one at a time. Lay one of {sausages} on each rectangle, ¼–½ inch (6–12 mm) from a short end."}, {"title": "Roll and seal", "text": "Whisk {milk} and {egg1} in a small bowl. Working one at a time, brush egg wash along the pastry edge opposite the sausage. Roll the pastry snugly around the sausage, stopping once it overlaps slightly, and press gently to seal. Trim off the extra dough and pinch the pastry closed around the ends of the sausage."}, {"title": "Chill", "text": "Set the logs on a parchment-lined baking sheet and freeze until chilled through but not frozen solid, 1–2 hours.", "timer": 90}, {"title": "Make the mustard sauce", "text": "Meanwhile, whisk {mustard}, {mayo}, {honey}, {lemon}, {cayenne}, {pepper}, {garlic}, {onion}, {paprika} and {salt} in a medium bowl. Taste and add more salt if needed. Cover and chill until serving."}, {"title": "Slice", "text": "Heat the oven to 220°C / 200°C fan / gas 7 (425°F). Whisk {egg2} in a small bowl. Slice the chilled logs into 1-inch (2.5 cm) pieces and arrange seam-side down on the baking sheet. Brush each piece with egg and sprinkle with flaky salt."}, {"title": "Bake", "text": "Bake until golden brown, 15–20 minutes. Let cool slightly and serve with the mustard sauce for dipping.", "timer": 18}], "variations": ["The spice mix in the sauce (cayenne, black pepper, garlic, onion, paprika and salt) is chef Kwame Onwuachi's go-to Creole seasoning. Use it on its own as a rub for meat, in a vinaigrette, or as a finishing seasoning.", "Save leftover puff pastry to make homemade 'hot pockets' with extra sausage and mustard sauce."], "tips": ["Andouille brings far more smoky, spicy flavor than regular cocktail franks.", "Chilling the logs before slicing keeps the cuts clean and the pieces round."], "makeAhead": [{"title": "Sauce", "text": "The mustard sauce keeps covered in the fridge for up to 3 days."}], "source": "Magazine clipping, p. 59 (chef Kwame Onwuachi)", "image": "img/creole-sausage-roll-ups.jpg", "added": "2026-10-21"}, {"id": "gravy-braised-turkey", "title": "Gravy-Braised Turkey", "category": "Mains", "description": "Turkey legs seared and braised in the oven right in their gravy with citrus, garlic, shallots and thyme, so the turkey and gravy are ready together.", "servings": 8, "servingWord": "servings", "yieldNote": "Serves 8", "activeTime": 45, "totalTime": 220, "equipment": ["Large braiser or Dutch oven with a lid (or foil)", "Rimmed baking sheet", "Kitchen twine", "13×9-inch (33×23 cm) baking dish, if your pot is small"], "groups": [{"name": "Turkey and aromatics", "items": [{"key": "turkey", "qty": 4, "name": "whole turkey legs (thigh and drumstick), about 6½ lb (2.9 kg) total, patted dry", "short": "turkey legs"}, {"name": "Kosher salt and freshly ground pepper"}, {"key": "oil", "qty": 45, "unit": "ml", "name": "vegetable oil", "short": "vegetable oil", "us": {"qty": 3, "unit": "tbsp"}, "note": "or more"}, {"key": "citrus", "qty": 2, "name": "large oranges and/or lemons, halved", "short": "halved oranges or lemons"}, {"key": "garlic", "qty": 2, "name": "heads garlic, tops trimmed to expose the cloves", "short": "heads garlic"}, {"key": "shallots", "qty": 3, "name": "large shallots, peeled", "short": "shallots"}]}, {"name": "Gravy", "items": [{"key": "butter", "qty": 85, "unit": "g", "name": "unsalted butter", "short": "butter", "us": {"qty": 0.75, "unit": "stick"}, "note": "6 tbsp"}, {"key": "flour", "qty": 42, "unit": "g", "name": "all-purpose flour", "short": "flour", "us": {"qty": 0.33, "unit": "cup"}}, {"key": "broth", "qty": 950, "unit": "ml", "name": "low-sodium chicken broth", "short": "chicken broth", "us": {"qty": 4, "unit": "cup"}}, {"key": "worcestershire", "qty": 3, "unit": "tbsp", "name": "Worcestershire sauce", "short": "Worcestershire sauce"}, {"key": "thyme", "qty": 1, "name": "small bunch thyme (about 10 sprigs), tied with kitchen twine", "short": "bunch of thyme"}]}], "steps": [{"title": "Heat the oven and season", "text": "Set a rack in the middle of the oven and heat to 160°C / 140°C fan / gas 3 (325°F). Season {turkey} all over with salt and pepper."}, {"title": "Sear the legs", "text": "Heat {oil} in a large braiser or Dutch oven over medium-high. Working in 2 batches if needed so the pot isn't crowded, lay the legs in skin-side down. Cook undisturbed, rotating the pot on the burner a few times so they brown evenly, until browned underneath and they release easily, 8–12 minutes. Move to a rimmed baking sheet, skin-side up. Don't brown the other side; the turkey is still raw at this point.", "timer": 10}, {"title": "Brown the aromatics", "text": "If the pot looks dry, add a little more oil. Lay {citrus} and {garlic} cut-side down in the pot with {shallots}. Cook undisturbed until deeply browned underneath, 2–3 minutes. Move each piece to the baking sheet as it's done (it's fine if some fall apart).", "timer": 3}, {"title": "Make the gravy", "text": "Melt {butter} in the pot. Sprinkle in {flour} and cook, stirring constantly, until no dry flour remains, about 1 minute. Slowly pour in {broth}, stirring constantly. Bring to a simmer and cook until the gravy just begins to thicken, about 2 minutes. Stir in {worcestershire} and season with salt and pepper.", "timer": 3}, {"title": "Braise covered", "text": "Nestle the legs into the gravy skin-side up, then tuck the citrus, garlic and shallots around them, cut sides up. Add {thyme}, cover tightly with a lid or foil and braise in the oven for 2 hours. If everything doesn't fit comfortably, pour the gravy into a 13×9-inch (33×23 cm) baking dish before adding the legs and aromatics.", "timer": 120}, {"title": "Finish uncovered", "text": "Uncover and keep baking until the legs are deeply browned, the meat shreds easily off the bone and the gravy has thickened a little, 45–55 minutes.", "timer": 50}, {"title": "Rest and serve", "text": "Let the turkey and gravy cool slightly. Serve from the pot or move to a platter. If there's a layer of fat on the gravy, skim it off with a spoon before serving or spooning it over the legs."}], "tips": ["Dark meat is forgiving. Unlike breast meat, braised legs stay moist even if they cook a little longer than planned.", "Making the gravy first means it's seasoned and ready the moment the turkey is, with no last-minute whisking.", "The meat is tender enough to pull apart with a serving spoon, so there's no carving. Let everyone help themselves."], "source": "Magazine clipping, pp. 77 and 85 (Jesse Szewczyk)", "image": "img/gravy-braised-turkey.jpg", "added": "2026-10-21"}, {"id": "fricod-brussels-sprouts", "title": "Frico'd Brussels Sprouts", "category": "Sides", "description": "Roasted brussels sprouts baked on a layer of grated Parmesan that crisps into a lacy, golden cheese cracker underneath.", "servings": 5, "servingWord": "servings", "yieldNote": "Serves 4–6", "activeTime": 10, "totalTime": 40, "equipment": ["Baking sheet", "Nonstick baking mat or parchment paper", "Medium bowl"], "groups": [{"name": "Sprouts", "items": [{"name": "Nonstick vegetable oil spray", "note": "if using parchment"}, {"key": "sprouts", "qty": 680, "unit": "g", "name": "brussels sprouts, trimmed and halved", "short": "brussels sprouts", "us": {"qty": 1.5, "unit": "lb"}}, {"key": "oil", "qty": 45, "unit": "ml", "name": "extra-virgin olive oil", "short": "olive oil", "us": {"qty": 3, "unit": "tbsp"}}, {"key": "salt", "qty": 0.5, "unit": "tsp", "name": "Diamond Crystal kosher salt", "short": "kosher salt", "note": "or ¼ tsp Morton"}, {"key": "pepper", "qty": 0.5, "unit": "tsp", "name": "freshly ground pepper", "short": "pepper"}, {"key": "parmesan", "qty": 113, "unit": "g", "name": "store-bought grated Parmesan", "short": "grated Parmesan", "us": {"qty": 4, "unit": "oz"}}]}], "steps": [{"title": "Heat the oven", "text": "Set a rack in the middle of the oven and heat to 200°C / 180°C fan / gas 6 (400°F). Line a baking sheet with a nonstick baking mat, or with parchment generously coated with nonstick spray."}, {"title": "Season the sprouts", "text": "Toss {sprouts}, {oil}, {salt} and {pepper} in a medium bowl."}, {"title": "Layer the cheese", "text": "Scatter {parmesan} in an even layer over the lined sheet, leaving a ½-inch (1 cm) border around the edges. Arrange the sprouts cut-side down on top in a single layer, spaced evenly to fill the sheet."}, {"title": "Bake", "text": "Bake until the sprouts are tender and browned and the cheese is deep golden, 20–28 minutes. It's done when the cheese in the very center has browned.", "timer": 24}, {"title": "Cool and serve", "text": "Let cool for at least 5 minutes so the cheese hardens, then break into pieces to serve. Or, for a showier finish, set another parchment-lined baking sheet upside down on top, hold them together and flip quickly, then peel off the mat and serve cheese-side up.", "timer": 5}], "tips": ["Pre-grated Parmesan works better here than grating your own from a block.", "Straight from the oven, the cheese looks soft and bendy. Give it a few minutes and it sets into a brittle, lacy shell.", "It's good at room temperature, so it can sit on the table through a long holiday meal."], "source": "Magazine clipping, Thanksgiving 2026, p. 32 (Jesse Szewczyk)", "image": "img/fricod-brussels-sprouts.jpg", "added": "2026-10-21"}, {"id": "steak-bites-spinach-couscous", "title": "Steak Bites with Couscous", "category": "Mains", "description": "Oregano-seasoned strip steak bites seared in cast iron, served over dill and arugula couscous with cucumber and a lemony yogurt sauce.", "servings": 4, "servingWord": "servings", "yieldNote": "Serves 4", "activeTime": 35, "totalTime": 45, "equipment": ["Medium bowl", "Large high-sided skillet or medium Dutch oven with a tight-fitting lid", "Large skillet, preferably cast iron", "Small bowl"], "groups": [{"name": "Steak", "items": [{"key": "steak", "qty": 510, "unit": "g", "name": "boneless New York strip steak (1–1½ inches / 2.5–4 cm thick), cut into 1-inch (2.5 cm) pieces", "short": "steak", "us": {"qty": 1.1, "unit": "lb"}, "note": "1–1¼ lb"}, {"key": "oregano", "qty": 1, "unit": "tbsp", "name": "dried oregano", "short": "dried oregano"}, {"key": "onionpowder", "qty": 2, "unit": "tsp", "name": "onion powder", "short": "onion powder"}, {"key": "sugar", "qty": 2, "unit": "tsp", "name": "sugar", "short": "sugar"}, {"key": "salt", "qty": 2, "unit": "tsp", "name": "Diamond Crystal kosher salt", "short": "kosher salt", "note": "or 1¼ tsp Morton; plus more"}, {"name": "Freshly ground pepper"}]}, {"name": "Arugula couscous", "items": [{"key": "oil1", "qty": 2, "unit": "tbsp", "name": "extra-virgin olive oil", "short": "olive oil"}, {"key": "scallions", "qty": 1, "name": "bunch scallions, thinly sliced", "short": "bunch sliced scallions"}, {"key": "dill", "qty": 12, "unit": "g", "name": "finely chopped dill", "short": "chopped dill", "us": {"qty": 0.5, "unit": "cup"}, "note": "plus sprigs to serve"}, {"name": "6 garlic cloves, finely chopped, divided"}, {"key": "spinach", "qty": 285, "unit": "g", "name": "baby arugula", "short": "baby arugula", "us": {"qty": 10, "unit": "oz"}}, {"key": "water", "qty": 240, "unit": "ml", "name": "water", "short": "water", "us": {"qty": 1, "unit": "cup"}}, {"key": "couscous", "qty": 175, "unit": "g", "name": "Moroccan couscous", "short": "couscous", "us": {"qty": 1, "unit": "cup"}}]}, {"name": "To cook and serve", "items": [{"key": "oil2", "qty": 1, "unit": "tbsp", "name": "extra-virgin olive oil", "short": "olive oil", "note": "plus more for drizzling"}, {"key": "lemon", "qty": 1, "name": "lemon", "short": "lemon", "note": "plus wedges for serving"}, {"name": "Thinly sliced cucumber"}, {"key": "yogurt", "qty": 245, "unit": "g", "name": "plain whole-milk yogurt", "short": "yogurt", "us": {"qty": 1, "unit": "cup"}}]}], "steps": [{"title": "Season the steak", "text": "Toss {steak}, {oregano}, {onionpowder}, {sugar} and {salt} in a medium bowl and season generously with pepper. Let sit for at least 10 minutes, or cover and chill for up to 8 hours. No need to bring it back to room temperature before cooking.", "timer": 10}, {"title": "Soften the scallions", "text": "Heat {oil1} in a large high-sided skillet or medium Dutch oven with a tight-fitting lid over medium. Add {scallions}, {dill}, half the garlic and a big pinch of salt. Cook, stirring now and then, until the scallions soften, about 5 minutes.", "timer": 5}, {"title": "Wilt the arugula", "text": "Add {spinach} 2–3 handfuls at a time, stirring and letting each batch wilt a little before adding more, 5–7 minutes total.", "timer": 6}, {"title": "Cook the couscous", "text": "Pour in {water} and bring to a boil, adding more salt if needed. Stir in {couscous}, breaking up any lumps. Take off the heat, cover quickly with the lid and leave for 10 minutes.", "timer": 10}, {"title": "Sear the steak", "text": "Meanwhile, heat {oil2} in a large skillet, preferably cast iron, over high. Lay the steak in a single layer and cook undisturbed until deeply browned underneath, 6–8 minutes. Turn the heat to medium and cook, stirring often, until just cooked through, about 1 minute more.", "timer": 8}, {"title": "Add the garlic", "text": "Take the pan off the heat, add the rest of the garlic and a big pinch of salt, and toss. The heat left in the pan takes the raw edge off the garlic."}, {"title": "Plate", "text": "Uncover the couscous and fluff with a fork to separate the grains. Spoon into a large shallow bowl or onto a platter and top with the steak. Cut {lemon} into quarters and squeeze one quarter over the steak. Scatter cucumber and some dill sprigs on top and drizzle with oil."}, {"title": "Make the yogurt sauce", "text": "Mix {yogurt} with a generous pinch of salt in a small bowl and squeeze in the juice from 2 lemon quarters. If it's thick, stir in water a spoonful at a time to loosen."}, {"title": "Serve", "text": "Serve the steak and couscous with the yogurt sauce, the last lemon quarter and extra lemon wedges for squeezing."}], "tips": ["Arugula releases liquid as it wilts, so this uses less water than the couscous package calls for. Stick to the measured amount for fluffy, not mushy, grains.", "Cutting steak into bites makes it as quick and easy to cook as chicken breast or tofu, and less likely to set off the smoke alarm."], "makeAhead": [{"title": "Season ahead", "text": "The seasoned steak keeps covered in the fridge for up to 8 hours and can go straight into the hot pan."}], "source": "Magazine clipping, Thanksgiving 2026, p. 20 (Shilpa Uskokovic)", "image": "img/steak-bites-spinach-couscous.jpg", "added": "2026-10-21"}, {"id": "broccoli-and-cheddar-soup", "title": "Broccoli and Cheddar Soup", "category": "Soups", "description": "A thick, roux-based broccoli soup loaded with very sharp Cheddar, blended as smooth or chunky as you like.", "servings": 6, "servingWord": "servings", "yieldNote": "Serves 4–6", "activeTime": 25, "totalTime": 60, "equipment": ["Large heavy-bottomed pot", "Whisk", "Hand blender or blender"], "groups": [{"name": "Soup", "items": [{"key": "butter", "qty": 85, "unit": "g", "name": "unsalted butter", "short": "butter", "us": {"qty": 6, "unit": "tbsp"}, "note": "used in two batches"}, {"key": "onion", "qty": 1, "name": "large yellow onion, finely chopped", "short": "chopped onion"}, {"key": "garlic", "qty": 2, "name": "garlic cloves, finely chopped", "short": "chopped garlic"}, {"key": "broccoli", "qty": 900, "unit": "g", "name": "broccoli, cut into florets, stems peeled and trimmed to 7.5 cm (3 in)", "short": "broccoli", "us": {"qty": 2, "unit": "lb"}}, {"key": "flour", "qty": 30, "unit": "g", "name": "all-purpose flour", "short": "flour", "us": {"qty": 0.25, "unit": "cup"}}, {"key": "broth", "qty": 720, "unit": "ml", "name": "low-sodium chicken or vegetable broth", "short": "broth", "us": {"qty": 3, "unit": "cup"}}, {"key": "halfhalf", "qty": 480, "unit": "ml", "name": "half-and-half", "short": "half-and-half", "us": {"qty": 2, "unit": "cup"}}, {"key": "cheddar", "qty": 225, "unit": "g", "name": "very sharp Cheddar, grated", "short": "grated Cheddar", "us": {"qty": 8, "unit": "oz"}, "note": "plus more for topping"}, {"key": "nutmeg", "qty": 0.25, "unit": "tsp", "name": "freshly grated nutmeg", "short": "nutmeg"}, {"name": "Kosher salt and freshly ground black pepper"}]}], "steps": [{"title": "Soften the onion", "text": "Melt half the {butter} in a large heavy-bottomed pot over medium heat. Add {onion} and {garlic}, season with salt and pepper, and cook, stirring now and then, until the onion is soft and translucent, 5–8 minutes.", "timer": 8}, {"title": "Cook the broccoli", "text": "Add {broccoli}, season with salt and pepper, and cook, stirring now and then, until bright green and just tender, 8–10 minutes. Scoop the broccoli mixture into a bowl and set aside.", "timer": 10}, {"title": "Make the roux", "text": "Melt the rest of the butter in the same pot over medium heat (leftover broccoli bits are fine). Add {flour} and whisk constantly until pale golden, 2–3 minutes.", "timer": 3}, {"title": "Add the liquids", "text": "Slowly whisk in {broth} until smooth; it will thicken a lot at first. Whisk in {halfhalf}, bring to a simmer, then stir in {cheddar}, {nutmeg} and all but about 1 cup of the broccoli mixture."}, {"title": "Simmer", "text": "Turn the heat to low and simmer until the soup has reduced by about a quarter and the broccoli is completely tender, 25–30 minutes.", "timer": 30}, {"title": "Blend", "text": "Purée with a hand blender (or in batches in a blender) until as smooth or chunky as you like."}, {"title": "Season and serve", "text": "Season with salt and pepper and ladle into bowls. Top with the reserved broccoli, extra Cheddar if you like, and plenty of black pepper."}], "variations": ["Use vegetable broth to make it vegetarian.", "Leave it chunky with bits of broccoli, or blend fully smooth."], "tips": ["Use the sharpest Cheddar you can find, white or orange; it adds richness and a needed tang.", "Add the broth gradually and keep whisking so the roux doesn't lump.", "If using a blender, fill it no more than halfway with hot soup and hold the lid down with a towel."], "makeAhead": [{"title": "Fridge", "text": "Keeps up to 3 days in the fridge. Reheat gently over low heat, stirring, and add a splash of broth if it has thickened. Dairy-heavy soups can turn grainy if frozen."}], "source": "NYT Cooking, Alison Roman", "image": "img/broccoli-and-cheddar-soup.jpg", "added": "2026-10-23"}, {"id": "broccoli-cheddar-soup", "title": "Broccoli-Cheddar Soup", "category": "Soups", "description": "Panera-style creamy broccoli-cheddar soup with carrots, ready in 30 minutes.", "servings": 4, "servingWord": "servings", "yieldNote": "Serves 4", "activeTime": 30, "totalTime": 30, "equipment": ["Large saucepan", "Whisk", "Box grater"], "groups": [{"name": "Soup", "items": [{"key": "butter", "qty": 70, "unit": "g", "name": "salted butter", "short": "butter", "us": {"qty": 5, "unit": "tbsp"}}, {"key": "onion", "qty": 75, "unit": "g", "name": "yellow onion, chopped", "short": "chopped onion", "us": {"qty": 0.5, "unit": "cup"}}, {"key": "flour", "qty": 30, "unit": "g", "name": "all-purpose flour", "short": "flour", "us": {"qty": 0.25, "unit": "cup"}}, {"key": "broth", "qty": 480, "unit": "ml", "name": "reduced-sodium chicken broth", "short": "chicken broth", "us": {"qty": 2, "unit": "cup"}}, {"key": "halfhalf", "qty": 480, "unit": "ml", "name": "half-and-half", "short": "half-and-half", "us": {"qty": 2, "unit": "cup"}}, {"key": "carrots", "qty": 110, "unit": "g", "name": "shredded or matchstick carrots", "short": "carrots", "us": {"qty": 1, "unit": "cup"}}, {"key": "broccoli", "qty": 200, "unit": "g", "name": "bite-size broccoli florets", "short": "broccoli florets", "us": {"qty": 3, "unit": "cup"}}, {"key": "cheddar", "qty": 225, "unit": "g", "name": "sharp cheddar cheese, shredded", "short": "shredded cheddar", "us": {"qty": 8, "unit": "oz"}, "note": "shred it from a block"}, {"key": "nutmeg", "qty": 0.25, "unit": "tsp", "name": "ground nutmeg", "short": "nutmeg"}, {"key": "salt", "qty": 0.25, "unit": "tsp", "name": "salt", "short": "salt"}, {"key": "pepper", "qty": 0.25, "unit": "tsp", "name": "freshly ground black pepper", "short": "black pepper"}]}], "steps": [{"title": "Soften the onion", "text": "Melt {butter} in a large saucepan over medium-low heat. Add {onion} and cook until softened, about 3 minutes.", "timer": 3}, {"title": "Cook the flour", "text": "Sprinkle in {flour} and cook, stirring, for 1 minute.", "timer": 1}, {"title": "Whisk in the liquids", "text": "Gradually whisk in {broth} and {halfhalf}. Cook and stir until thickened and bubbly."}, {"title": "Simmer the carrots", "text": "Add {carrots} and simmer for 5 minutes, stirring now and then.", "timer": 5}, {"title": "Add the broccoli", "text": "Add {broccoli} and keep simmering, stirring now and then, until the vegetables are just tender, about 5 minutes more.", "timer": 5}, {"title": "Melt in the cheese", "text": "Turn the heat to low. Stir in {cheddar} until melted, then stir in {nutmeg}, {salt} and {pepper}."}], "tips": ["Buy a block of cheddar and shred it just before using. Pre-shredded cheese do   try { blob = await buildPDF(r) } catch { shareMsg("The PDF maker didn't load. Check your connection and try again."); return }
